<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>IES Card 3D</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=Permanent+Marker&amp;family=Herr+Von+Muellerhoff&amp;family=IBM+Plex+Sans+Arabic:wght@500;700&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFC21A}a:hover{color:#FFE08A}
</style>
</helmet>
<div style="width: 1200px; height: 820px; position: relative; overflow: hidden; background: #060D1F; color: #F3F6FA; font-family: 'IBM Plex Sans Arabic', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px">
<svg aria-hidden="true" width="1200" height="820" viewBox="0 0 1200 820" style="position: absolute; inset: 0">
<defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#1C2C4D"></circle></pattern></defs>
<rect width="1200" height="820" fill="url(#dots)"></rect>
</svg>
<div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="font-size: 32px; font-weight: 700" dir="rtl" lang="ar">بطاقتك الذكية</div>
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 14px; letter-spacing: 0.2em; color: #8EA3BC" dir="ltr">MOVE TO TILT · CLICK TO FLIP</div>
</div>
<div style="position: relative; width: 856px; height: 540px; perspective: 1600px" onMouseMove="{{onMove}}" onMouseLeave="{{onLeave}}" onClick="{{flip}}">
<div style="position: absolute; inset: 0; transform-style: preserve-3d; transform: {{transform}}; transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1); cursor: pointer">
<div style="position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 32px; overflow: hidden; box-shadow: 0 40px 80px rgba(0, 0, 0, 0.55)">
<sc-if value="{{white}}" hint-placeholder-val="{{ false }}">
<dc-import name="WhiteFront" role="{{role}}" founding="{{founding}}" hint-size="856px,540px"></dc-import>
</sc-if>
<sc-if value="{{colored}}" hint-placeholder-val="{{ true }}">
<dc-import name="Main" role="{{role}}" tone="{{tone}}" founding="{{founding}}" hint-size="856px,540px"></dc-import>
</sc-if>
<div style="position: absolute; inset: 0; border-radius: 32px; pointer-events: none; mix-blend-mode: overlay; background: {{holo}}"></div>
</div>
<div style="position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: rotateY(180deg); border-radius: 32px; overflow: hidden; box-shadow: 0 40px 80px rgba(0, 0, 0, 0.55)">
<sc-if value="{{white}}" hint-placeholder-val="{{ false }}">
<dc-import name="WhiteBack" role="{{role}}" founding="{{founding}}" hint-size="856px,540px"></dc-import>
</sc-if>
<sc-if value="{{colored}}" hint-placeholder-val="{{ true }}">
<dc-import name="Back" role="{{role}}" tone="{{tone}}" founding="{{founding}}" hint-size="856px,540px"></dc-import>
</sc-if>
<div style="position: absolute; inset: 0; border-radius: 32px; pointer-events: none; mix-blend-mode: overlay; background: {{holoBack}}"></div>
</div>
</div>
</div>
<div style="position: relative; display: flex; gap: 14px" dir="rtl">
<button type="button" onClick="{{flip}}" style="min-height: 48px; padding: 12px 28px; border: 0; border-radius: 999px; background: #FFC21A; color: #0B1530; font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 18px; font-weight: 700; cursor: pointer" lang="ar">{{flipLabel}}</button>
<button type="button" onClick="{{toggleTheme}}" style="min-height: 48px; padding: 12px 28px; border: 2px solid #FFFFFF; border-radius: 999px; background: transparent; color: #FFFFFF; font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 18px; font-weight: 700; cursor: pointer" lang="ar">{{themeLabel}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["chair","vice","tech","events","media","member"],"default":"vice","section":"Member"},"founding":{"editor":"boolean","default":true,"section":"Member"},"$preview":{"width":1200,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { rx: 0, ry: 0, gx: 50, flipped: false, theme: 0 };
  }
  renderVals() {
    const s = this.state;
    const ry = s.ry + (s.flipped ? 180 : 0);
    const glare = (x) => 'linear-gradient(115deg, rgba(255,255,255,0) ' + (x - 30) + '%, rgba(255,255,255,0.55) ' + x + '%, rgba(120,220,255,0.25) ' + (x + 8) + '%, rgba(255,255,255,0) ' + (x + 30) + '%)';
    return {
      role: this.props.role ?? 'vice',
      founding: this.props.founding ?? true,
      transform: 'rotateX(' + s.rx + 'deg) rotateY(' + ry + 'deg)',
      holo: glare(s.gx),
      holoBack: glare(100 - s.gx),
      flipLabel: s.flipped ? 'شوف الوجه' : 'اقلب الكرت',
      white: s.theme === 0,
      colored: s.theme !== 0,
      tone: s.theme === 2 ? 'navy' : 'blue',
      themeLabel: ['التالي: الملوّنة', 'التالي: الكحلية', 'التالي: البيضاء'][s.theme],
      toggleTheme: () => this.setState({ theme: (this.state.theme + 1) % 3 }),
      onMove: (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width;
        const y = (e.clientY - r.top) / r.height;
        this.setState({ rx: Math.round((0.5 - y) * 18), ry: Math.round((x - 0.5) * 26), gx: Math.round(x * 100) });
      },
      onLeave: () => this.setState({ rx: 0, ry: 0, gx: 50 }),
      flip: () => this.setState({ flipped: !this.state.flipped })
    };
  }
}
</script>
</body>
</html>
