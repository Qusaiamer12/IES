<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>IEEE IES HU Chapter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;700&family=JetBrains+Mono:wght@600&family=Permanent+Marker&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
/* Layout: white header + navy page heroes with the card's diagonal slab and outlined lettering; content sections alternate white / navy,
   cards carry the card's hard offset shadow. One committed brand look (no dark variant): every colour is set explicitly. */
:root{
  --blue:#1449D6; --navy:#0B1530; --navy-deep:#0F2347; --navy-line:#24345A; --night:#060D1F;
  --orange:#FF6B1A; --gold:#FFC21A; --white:#FFFFFF; --paper:#F4F6FA;
  --ink-2:#4A5468; --ink-3:#5A6478; --rule:#D6DAE2; --mist:#C3CEDF;
  --f-en:'Space Grotesk',system-ui,sans-serif;
  --f-ar:'IBM Plex Sans Arabic','Space Grotesk',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --f-marker:'Permanent Marker','Comic Sans MS',cursive;
  --maxw:1180px; --gutter:clamp(16px,4vw,40px);
  --bleed:calc(var(--gutter) + max(0px, (100vw - var(--maxw) - 2 * var(--gutter)) / 2));
  --pt:clamp(44px,7vw,96px); --pb:clamp(64px,9vw,112px);
  color-scheme:light;
}
html{background:var(--navy)}
body{margin:0;background:var(--white);color:var(--navy);font-family:var(--f-en);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
.sec-navy :focus-visible,.hero :focus-visible,.foot :focus-visible{outline-color:var(--gold)}
.mono{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}
.skip{position:absolute;left:16px;top:-60px;z-index:60;background:var(--gold);color:var(--navy);padding:10px 16px;border-radius:999px;font-weight:700;text-decoration:none}
.skip:focus{top:12px}
.wrap{max-width:calc(var(--maxw) + 2 * var(--gutter));margin-inline:auto;padding-inline:var(--gutter)}

/* ---------- IEEE bar + header ---------- */
.ieee-bar{background:var(--night);color:var(--mist);font-size:13px}
.ieee-bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:36px}
.ieee-bar ul{display:flex;flex-wrap:wrap;gap:0 18px}
.ieee-bar a{text-decoration:none;color:var(--mist);display:inline-block;padding-block:8px}
.ieee-bar a:hover{color:var(--white)}
.ieee-bar .mark{font:700 15px/1 var(--f-en);letter-spacing:.06em;color:var(--white)}
@media (max-width:560px){.ieee-bar .opt{display:none}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--white);border-bottom:1px solid var(--rule)}
.top-in{display:flex;align-items:center;gap:18px;min-height:84px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;flex-shrink:0}
.brand img{height:52px;width:auto}
.brand-txt{font:700 13px/1.2 var(--f-en);letter-spacing:.12em;padding-left:14px;border-left:2px solid var(--rule)}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{position:relative;text-decoration:none;font-weight:700;font-size:15px;padding:10px 11px;color:var(--ink-2);white-space:nowrap}
.nav a:hover{color:var(--blue)}
.nav a[aria-current="page"]{color:var(--navy)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:11px;right:11px;bottom:2px;height:3px;border-radius:2px;background:var(--orange)}
.top-cta{min-height:46px;padding:9px 22px;font-size:15px;flex-shrink:0}
.menu-btn{display:none;width:46px;height:46px;border-radius:999px;border:0;background:var(--gold);color:var(--navy);cursor:pointer;align-items:center;justify-content:center;margin-left:auto}
.nav .nav-join{display:none}
@media (max-width:1120px){
  .brand-txt{display:none}
  .top .top-cta{display:none}
  .menu-btn{display:inline-flex}
  .top-in{min-height:72px}
  .brand img{height:44px}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--white);flex-direction:column;padding:6px var(--gutter) 18px;border-bottom:4px solid var(--gold);box-shadow:0 14px 28px rgba(11,21,48,.14)}
  .nav.open{display:flex}
  .nav a{font-size:18px;padding:14px 4px;border-bottom:1px solid var(--rule)}
  .nav a[aria-current="page"]::after{left:-12px;right:auto;top:16px;bottom:16px;width:4px;height:auto}
  .nav .nav-join{display:block;color:var(--orange)}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:12px 28px;border-radius:999px;border:2px solid transparent;font-weight:700;font-size:16px;line-height:1.2;text-decoration:none;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,background .15s ease;white-space:nowrap}
.btn svg{flex-shrink:0}
.btn-gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.btn-navy{background:var(--navy);color:var(--white);border-color:var(--navy)}
.btn-light{background:transparent;color:var(--white);border-color:var(--white)}
.btn-light:hover{background:var(--white);color:var(--navy)}
.btn-dark{background:var(--white);color:var(--navy);border-color:var(--navy)}
.btn-dark:hover{background:var(--navy);color:var(--white)}
.btn-hard{box-shadow:5px 5px 0 var(--hard,var(--navy))}
.btn-hard:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--hard,var(--navy))}
.sec-navy .btn-hard,.hero .btn-hard{--hard:var(--gold)}
.btn-gold.btn-hard{border-color:var(--navy)}
.sec-navy .btn-gold.btn-hard,.hero .btn-gold.btn-hard{border-color:var(--gold);--hard:var(--orange)}
.btn-row{display:flex;flex-wrap:wrap;gap:14px}

/* ---------- section scaffolding ---------- */
.sec{position:relative;overflow:hidden;padding-block:clamp(64px,8vw,108px)}
.sec-navy{background:var(--navy);color:var(--white)}
.sec-white{background:var(--white)}
.sec-paper{background:var(--paper)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font:600 13px/1.4 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin-bottom:14px}
.eyebrow svg{flex-shrink:0}
.sec-navy .eyebrow,.hero .eyebrow{color:var(--gold)}
h2{font-size:clamp(32px,4.4vw,52px);line-height:1.04;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
.lead{font-size:clamp(17px,1.5vw,20px);line-height:1.7;max-width:62ch;color:var(--ink-2)}
.sec-navy .lead,.hero .lead{color:var(--mist)}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 40px;margin-bottom:clamp(32px,4vw,52px)}
.sec-head>div{min-width:0;max-width:740px}
.sec-head .lead{margin-top:14px}
.edge{position:absolute;left:0;right:0;bottom:0;height:22px;pointer-events:none}
.edge svg{width:100%;height:100%;display:block}
.tbd{display:inline-block;font:600 12px/1.4 var(--f-mono);letter-spacing:.06em;background:rgba(255,194,26,.22);border:1px dashed currentColor;border-radius:6px;padding:1px 7px;white-space:nowrap}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background-color:var(--navy);background-image:radial-gradient(rgba(255,255,255,.08) 1.3px,transparent 1.6px);background-size:26px 26px;color:var(--white);padding-block:var(--pt) var(--pb)}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:32px;align-items:center}
.hero-copy{position:relative;z-index:2;min-width:0;display:flex;flex-direction:column;gap:22px}
.hero h1{font-size:clamp(54px,8.4vw,112px);line-height:.93;font-weight:700;letter-spacing:-.045em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero-copy .eyebrow{margin-bottom:0}
.hero-art{position:relative;min-height:460px}
.slabs{position:absolute;top:calc(-1 * var(--pt));bottom:calc(-1 * var(--pb));left:0;right:calc(-1 * var(--bleed))}
.slabs svg{width:100%;height:100%;display:block}
.outline-word{position:absolute;right:calc(-.06em - var(--bleed) + var(--gutter));bottom:calc(-1 * var(--pb) - .14em);font:700 clamp(170px,25vw,320px)/1 var(--f-en);letter-spacing:-.04em;color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.3);pointer-events:none;user-select:none;white-space:nowrap}
.hero-art .stamp{position:absolute;z-index:2;top:4%;left:12%;width:clamp(140px,17vw,200px);transform:rotate(-12deg)}
.hero-art .sticker{position:absolute;z-index:2;bottom:16%;left:2%}
@media (max-width:860px){
  .hero-grid{grid-template-columns:1fr;gap:28px}
  .hero-art{min-height:300px}
  .slabs{top:0;left:calc(-1 * var(--gutter));right:calc(-1 * var(--gutter))}
  .outline-word{right:-.06em}
  .hero-art .stamp{top:8%;left:4%;width:132px}
  .hero-art .sticker{bottom:16%;left:auto;right:4%}
  .hero-art .sticker span{font-size:20px}
}
/* inner page hero */
.page-hero{padding-block:clamp(48px,6vw,84px) clamp(64px,7vw,96px)}
.page-hero h1{font-size:clamp(46px,6.8vw,88px)}
.page-hero .hero-copy{max-width:720px;gap:18px}
.page-hero .slab-corner{position:absolute;top:0;bottom:0;right:0;width:min(36vw,440px)}
.page-hero .slab-corner svg{width:100%;height:100%;display:block}
.page-hero .outline-word{right:-.04em;bottom:-.2em;font-size:clamp(110px,16vw,220px);-webkit-text-stroke:2px rgba(255,255,255,.22)}
@media (max-width:760px){.page-hero .slab-corner{width:30vw}}
@media (max-width:520px){.page-hero .slab-corner{display:none}}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--mist)}
.crumbs a{color:var(--white);text-decoration:none;font-weight:500}
.crumbs a:hover{color:var(--gold)}
.crumbs .sep{opacity:.6}

/* shared card motifs */
.stamp{display:block}
.sticker{display:inline-flex;align-items:center;gap:12px;background:var(--navy);color:var(--white);border-radius:14px;padding:10px 22px 12px;transform:rotate(-6deg);box-shadow:7px 7px 0 var(--gold);white-space:nowrap}
.sticker span{font:400 clamp(22px,2.6vw,32px)/1 var(--f-marker)}
.hex{display:block;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:9px;width:fit-content;border-radius:999px;padding:6px 15px;background:var(--navy);color:var(--gold);font:700 13px/1.3 var(--f-en);letter-spacing:.08em;margin-block:6px 4px}
.pill.lead{background:var(--gold);color:var(--navy)}
.pill .div{width:2px;height:16px;background:var(--navy);opacity:.35;border-radius:2px}
.pill-lg{font-size:17px;padding:9px 20px}

/* ---------- stats (overlap the hero edge) ---------- */
.stats-wrap{position:relative;z-index:3;margin-top:calc(-1 * clamp(36px,4vw,56px))}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.stat{display:flex;flex-direction:column;gap:8px;padding:24px 24px 22px;background:var(--white);border:2px solid var(--navy);border-radius:18px;box-shadow:7px 7px 0 var(--navy)}
.stat b{font:700 clamp(36px,4vw,52px)/1 var(--f-en);letter-spacing:-.03em}
.stat span{font:700 12px/1.45 var(--f-en);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.stat small{font:600 11px/1.3 var(--f-mono);color:var(--ink-3);letter-spacing:.04em}
.stat.hot{background:var(--gold)}
.stat.hot span,.stat.hot small{color:var(--navy)}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}}

/* ---------- 75 years ---------- */
.s75{position:relative;overflow:hidden;background:var(--orange);color:var(--navy);padding-block:clamp(64px,8vw,108px)}
.s75-grid{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(28px,5vw,72px);align-items:center}
@media (max-width:860px){.s75-grid{grid-template-columns:1fr}}
.n75-wrap{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.n75{font:700 clamp(200px,30vw,400px)/.78 var(--f-en);letter-spacing:-.07em;color:var(--white);text-shadow:12px 12px 0 var(--navy);-webkit-text-stroke:3px var(--navy);padding-right:.08em}
.n75-l{font:600 clamp(12px,1.2vw,15px)/1.3 var(--f-mono);letter-spacing:.16em;background:var(--navy);color:var(--gold);padding:8px 14px;border-radius:8px}
.s75-copy{display:flex;flex-direction:column;gap:18px;min-width:0}
.s75 .eyebrow{color:var(--navy);margin-bottom:0}
.s75-copy h2{font-size:clamp(30px,3.8vw,48px);text-wrap:pretty}
.s75-copy p{font-size:clamp(17px,1.5vw,19px);line-height:1.7;font-weight:500;max-width:54ch}
.mini-tl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:3px solid var(--navy);margin-top:8px}
.mini-tl li{position:relative;display:flex;flex-direction:column;gap:4px;padding:16px 10px 0 0}
.mini-tl li::before{content:"";position:absolute;top:-9px;left:0;width:14px;height:14px;background:var(--navy);transform:rotate(45deg)}
.mini-tl li.on::before{background:var(--white);border:3px solid var(--navy)}
.mini-tl b{font:700 22px/1 var(--f-en)}
.mini-tl span{font-size:13px;font-weight:600;line-height:1.4}
@media (max-width:520px){.mini-tl{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:18px}}

/* ---------- events ---------- */
.events{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:28px}
.event{display:flex;flex-direction:column;border:2px solid var(--navy);border-radius:22px;overflow:hidden;box-shadow:8px 8px 0 var(--navy);background:var(--white);transition:transform .18s ease,box-shadow .18s ease}
.event:hover{transform:translate(-3px,-3px);box-shadow:11px 11px 0 var(--navy)}
.ev-img{position:relative;aspect-ratio:16/9;background:var(--navy-deep);overflow:hidden}
.ev-img img{width:100%;height:100%;object-fit:cover}
.ev-img svg{position:absolute;inset:0;width:100%;height:100%}
.ev-img .tag{position:absolute;top:14px;left:14px}
.tag{display:inline-block;width:fit-content;background:var(--gold);color:var(--navy);font:700 12px/1.3 var(--f-en);letter-spacing:.12em;text-transform:uppercase;padding:6px 11px;border-radius:999px}
.ev-date{position:absolute;right:14px;bottom:14px;background:var(--white);color:var(--navy);border-radius:14px;padding:8px 12px;text-align:center;box-shadow:4px 4px 0 var(--navy);min-width:64px}
.ev-date b{display:block;font:700 28px/1 var(--f-en);letter-spacing:-.02em}
.ev-date span{font:600 11px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.ev-body{display:flex;flex-direction:column;gap:10px;padding:22px 24px 24px;flex:1}
.ev-body h3{font-size:22px;line-height:1.25;letter-spacing:-.01em}
.ev-body h3 a{text-decoration:none}
.ev-body h3 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.ev-body p{color:var(--ink-2);font-size:16px}
.ev-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font:600 13px/1.3 var(--f-mono);color:var(--blue)}
.ev-meta span{display:inline-flex;align-items:center;gap:6px}
.textlink{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--blue);margin-top:auto}
.sec-navy .textlink{color:var(--gold)}
.empty{display:flex;flex-wrap:wrap;align-items:center;gap:22px 28px;border:2px dashed var(--rule);border-radius:24px;padding:clamp(24px,4vw,40px);background:var(--white)}
.empty>div{min-width:0;flex:1 1 280px;display:flex;flex-direction:column;gap:8px}
.empty h3{font-size:22px;line-height:1.35}
.empty p{color:var(--ink-2);max-width:62ch}
.empty a{color:var(--blue);font-weight:700}
.article{max-width:72ch;display:flex;flex-direction:column;gap:18px}
.article p{font-size:18px;line-height:1.8;color:var(--ink-2)}
.article .cover{border-radius:20px;overflow:hidden;border:2px solid var(--navy);box-shadow:8px 8px 0 var(--navy)}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px 22px;font:600 15px/1.3 var(--f-mono);color:var(--gold)}
.hero-meta span{display:inline-flex;align-items:center;gap:8px}
.back-link{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--blue);min-height:44px}
.back-link svg{transform:scaleX(-1)}

/* ---------- partners ---------- */
.partners{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
.partner{flex:0 1 210px;height:120px;display:flex;align-items:center;justify-content:center;padding:18px 22px;background:var(--white);border:2px solid var(--rule);border-radius:18px;transition:border-color .2s,box-shadow .2s}
.partner img{max-height:74px;max-width:100%;width:auto;filter:grayscale(1);opacity:.7;transition:filter .2s,opacity .2s}
.partner:hover{border-color:var(--navy);box-shadow:6px 6px 0 var(--navy)}
.partner:hover img{filter:none;opacity:1}
.partners-note{margin-top:26px;text-align:center;font-size:14px;color:var(--ink-3)}
@media (max-width:520px){.partner{flex-basis:calc(50% - 9px);height:100px;padding:14px}.partner img{max-height:56px}}

/* ---------- CTA ---------- */
.cta{position:relative;overflow:hidden;background:var(--orange);color:var(--navy);padding-block:clamp(60px,7vw,92px)}
.cta .art{position:absolute;top:0;bottom:0;right:0;width:min(46vw,560px)}
.cta .art svg{width:100%;height:100%;display:block}
.cta-in{position:relative;z-index:1;display:flex;flex-direction:column;gap:20px;max-width:640px}
.cta h2{font-size:clamp(36px,5vw,62px)}
.cta p{font-size:clamp(17px,1.5vw,20px);font-weight:500;max-width:50ch}
.cta .btn-navy{--hard:var(--white)}
@media (max-width:700px){.cta .art{display:none}}

/* ---------- about ---------- */
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(32px,6vw,80px);align-items:start}
.split>*{min-width:0}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.prose{display:flex;flex-direction:column;gap:18px}
.prose .eyebrow{margin-bottom:0}
.prose p{font-size:clamp(17px,1.5vw,19px);line-height:1.8;max-width:62ch;color:var(--ink-2)}
.sec-navy .prose p{color:var(--mist)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:9px;min-height:42px;padding:6px 16px;border:2px solid var(--navy);border-radius:999px;font-weight:700;font-size:15px;background:var(--white);color:var(--navy)}
.chip i{width:8px;height:8px;border-radius:2px;background:var(--orange);transform:rotate(45deg);flex-shrink:0}
.panel{border:2px solid var(--navy);border-radius:22px;padding:clamp(22px,3vw,32px);box-shadow:8px 8px 0 var(--navy);background:var(--white);color:var(--navy);display:flex;flex-direction:column;gap:18px}
.panel h3{font:600 13px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.facts4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:2px solid var(--navy-line)}
.facts4 div{padding:24px 20px 0 0;display:flex;flex-direction:column;gap:6px}
.facts4 b{font:700 clamp(34px,4vw,48px)/1 var(--f-en);color:var(--gold);letter-spacing:-.03em}
.facts4 span{color:var(--mist);font-size:15px;line-height:1.5}
@media (max-width:860px){.facts4{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:12px}}
.timeline{display:flex;flex-direction:column;border-left:3px solid var(--navy);margin-left:10px}
.tl{position:relative;padding:0 0 30px 32px;display:flex;flex-direction:column;gap:4px}
.tl::before{content:"";position:absolute;left:-12px;top:6px;width:18px;height:18px;border-radius:4px;background:var(--gold);transform:rotate(45deg);border:3px solid var(--navy)}
.tl.now::before{background:var(--orange)}
.tl b{font:700 30px/1 var(--f-en);letter-spacing:-.02em}
.tl h3{font-size:19px;line-height:1.4}
.tl p{color:var(--ink-2);max-width:60ch;font-size:16px}

  /* ===== vCard ===== */
  const vEsc = s => String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1');
  const vcard = m => {
    const parts = String(m.nameEn).trim().split(/\s+/);
    const last = parts.length > 1 ? parts.pop() : '';
    const out = ['BEGIN:VCARD', 'VERSION:3.0', `N:${vEsc(last)};${vEsc(parts.join(' '))};;;`, `FN:${vEsc(m.nameEn)}`,
      'ORG:IEEE IES Student Chapter\\, Hashemite University', `TITLE:${vEsc(role(m).label)}`,
      `NOTE:${vEsc([m.nameAr, m.specialtyEn, m.memberId].filter(Boolean).join(' · '))}`];
    if (CONFIG.domain) out.push(`URL:https://${CONFIG.domain}/m/${m.slug}`);
    const k = m.links || {};
    if (k.email) out.push(`EMAIL;TYPE=INTERNET:${k.email}`);
    if (k.phone) out.push(`TEL;TYPE=CELL:${k.phone}`);
    if (k.linkedin) out.push(`X-SOCIALPROFILE;TYPE=linkedin:${k.linkedin}`);
    if (k.instagram) out.push(`X-SOCIALPROFILE;TYPE=instagram:${k.instagram}`);
    out.push('END:VCARD');
    return out.join('\r\n') + '\r\n';
  };

  /* ===== router ===== */
  const PAGES = { home, chapter, team, events, projects, join, contact };
  const ALIASES = { about: 'chapter', officers: 'team', membership: 'join' };
  const TITLES = { home: 'Home', chapter: 'The Chapter', team: 'Our Team', events: 'Events', projects: 'Projects', join: 'Join Us', contact: 'Contact' };
  const app = document.getElementById('app');
  document.documentElement.lang = 'en';
  document.documentElement.dir = 'ltr';

  function render() {
    let route = location.hash.slice(1) || 'home';
    route = ALIASES[route] || route;
    uid = 0;
    let key, body, title;
    if (route.startsWith('m-')) {
      const m = MEMBERS.find(x => x.slug === route.slice(2));
      key = 'team'; body = memberPage(route.slice(2)); title = m ? m.nameEn : 'Member not found';

      const e = EVENTS.find(x => x.slug === route.slice(2));

  function bind(route) {
    const mb = document.getElementById('menuBtn'), nav = document.getElementById('nav');
    mb.onclick = () => {

      mb.setAttribute('aria-expanded', open);
      mb.innerHTML = ico(open ? P.close : P.menu, 22, 'currentColor', 2.4);
    };
    document.querySelector('[data-skip]').onclick = e => { e.preventDefault(); document.getElementById('main').focus(); };
    document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => {
      teamFilter = b.dataset.filter; render(); document.querySelector(`[data-filter="${teamFilter}"]`).focus();
    });
    document.querySelectorAll('[data-term]').forEach(b => b.onclick = () => {
      teamTerm = b.dataset.term; teamFilter = 'all'; render(); document.querySelector(`[data-term="${teamTerm}"]`).focus();
    });
    const cf = document.getElementById('contactForm');
    if (cf) cf.onsubmit = async e => {
      e.preventDefault();
      const msg = document.getElementById('contactMsg');
      const bad = [...cf.elements].find(el => el.required && !el.checkValidity());
      if (bad) { msg.textContent = 'Fill in every field and check the email address.'; bad.focus(); return; }
      if (!CONFIG.contactFormUrl) { msg.textContent = 'The form is not connected yet. It will work once a Formspree link is added in the settings.'; return; }
      try {
        const r = await fetch(CONFIG.contactFormUrl, { method: 'POST', body: new FormData(cf), headers: { Accept: 'application/json' } });
        if (!r.ok) throw new Error();
        cf.reset(); msg.textContent = 'Message received. We will reply soon.';
      } catch (_) { msg.textContent = 'Could not send the message. Try again, or message us on Instagram.'; }
    };
    const vb = document.getElementById('vcfBtn');
    if (vb) vb.onclick = () => {
      const m = MEMBERS.find(x => x.slug === route.slice(2));
      const msg = document.getElementById('vcfMsg');
      try {
        const url = URL.createObjectURL(new Blob([vcard(m)], { type: 'text/vcard;charset=utf-8' }));
        const a = Object.assign(document.createElement('a'), { href: url, download: `${m.slug}.vcf` });
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        msg.textContent = 'Contact file ready. Open it to save to your phone.';
      } catch (e) { msg.textContent = 'Could not create the file in this browser.'; }
    };
  }

  window.addEventListener('hashchange', () => { if (location.hash === '#main') return; render(); window.scrollTo(0, 0); });
  render();
})();
</script>

</body>
</html>
