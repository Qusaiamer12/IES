<title>IES HU Chapter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=JetBrains+Mono:wght@600&family=Permanent+Marker&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed sections alternating navy / white, diagonal card slabs bleeding off the inline-end edge, content in a 1180px column.
   Single brand look (navy + white grounds) on purpose, so no dark-mode variant: every colour is set explicitly. */
:root{
  --blue:#1449D6; --navy:#0B1530; --navy-deep:#0F2347; --navy-line:#24345A;
  --orange:#FF6B1A; --gold:#FFC21A; --white:#FFFFFF;
  --ink-2:#4A5468; --ink-3:#5A6478; --rule:#D6DAE2; --mist:#C3CEDF;
  --f-en:'Space Grotesk','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-ar:'IBM Plex Sans Arabic','Space Grotesk',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --f-marker:'Permanent Marker','Comic Sans MS',cursive;
  --maxw:1180px; --gutter:clamp(16px,4vw,40px);
  --bleed:calc(var(--gutter) + max(0px, (100vw - var(--maxw) - 2 * var(--gutter)) / 2));
  --pt:clamp(44px,7vw,96px); --pb:clamp(64px,9vw,112px);
  color-scheme:light;
}
html{background:var(--navy)}
body{margin:0;background:var(--white);color:var(--navy);font-family:var(--f-ar);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html[lang="en"] body{font-family:var(--f-en)}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul{padding:0;list-style:none}
a{color:inherit}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.sec-white :focus-visible{outline-color:var(--blue)}
.ltr{direction:ltr;unicode-bidi:isolate}
.mono{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.en{font-family:var(--f-en)}
.skip{position:absolute;inset-inline-start:16px;top:-60px;z-index:50;background:var(--gold);color:var(--navy);padding:10px 16px;border-radius:999px;font-weight:700;text-decoration:none}
.skip:focus{top:12px}

.wrap{max-width:calc(var(--maxw) + 2 * var(--gutter));margin-inline:auto;padding-inline:var(--gutter)}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--navy);color:var(--white);border-bottom:1px solid var(--navy-line)}
.top-in{display:flex;align-items:center;gap:20px;min-height:68px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex-shrink:0}
.brand-pill{background:var(--white);border-radius:12px;padding:5px 9px}
.brand-pill img{height:34px;width:auto}
.brand-txt{font:700 14px/1.15 var(--f-en);letter-spacing:.1em}
.nav{display:flex;gap:4px;margin-inline-start:auto}
.nav a{position:relative;text-decoration:none;font-weight:700;font-size:16px;padding:10px 14px;border-radius:999px;color:var(--mist)}
.nav a:hover{color:var(--white)}
.nav a[aria-current="page"]{color:var(--white)}
.nav a[aria-current="page"]::after{content:"";position:absolute;inset-inline:14px;bottom:3px;height:3px;border-radius:2px;background:var(--gold)}
.top-actions{display:flex;gap:8px;align-items:center}
.lang{min-height:42px;min-width:56px;padding:6px 14px;border-radius:999px;border:2px solid var(--white);background:transparent;cursor:pointer;font-weight:700;font-size:15px}
.lang:hover{background:var(--white);color:var(--navy)}
.menu-btn{display:none;width:44px;height:44px;border-radius:999px;border:0;background:var(--gold);color:var(--navy);cursor:pointer;align-items:center;justify-content:center}
@media (max-width:880px){
  .brand-txt{display:none}
  .top-actions{margin-inline-start:auto}
  .menu-btn{display:inline-flex}
  .nav{display:none;position:absolute;inset-inline:0;top:100%;background:var(--navy);flex-direction:column;padding:8px var(--gutter) 20px;border-bottom:4px solid var(--gold)}
  .nav.open{display:flex}
  .nav a{font-size:19px;padding:14px 4px;border-radius:0;border-bottom:1px solid var(--navy-line)}
  .nav a[aria-current="page"]::after{inset-inline:auto;inset-inline-start:-12px;top:18px;bottom:18px;width:4px;height:auto}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:12px 28px;border-radius:999px;border:2px solid transparent;font-weight:700;font-size:17px;line-height:1.2;text-decoration:none;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.btn svg{flex-shrink:0}
.btn-gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.btn-outline{background:transparent;color:inherit;border-color:currentColor}
.btn-navy{background:var(--navy);color:var(--white);border-color:var(--navy)}
.btn-hard{box-shadow:5px 5px 0 var(--hard,var(--navy))}
.btn-hard:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--hard,var(--navy))}
.btn-gold:not(.btn-hard):hover{box-shadow:0 0 0 4px rgba(255,194,26,.3)}
.btn-outline:hover{background:currentColor}
.btn-outline:hover>*{color:var(--navy)}
.sec-navy .btn-outline:hover,.hero .btn-outline:hover{background:var(--white);color:var(--navy)}
.sec-white .btn-outline:hover{background:var(--navy);color:var(--white)}
.btn-row{display:flex;flex-wrap:wrap;gap:14px}

/* ---------- sections ---------- */
.sec{position:relative;overflow:hidden;padding-block:clamp(56px,8vw,104px)}
.sec-navy{background:var(--navy);color:var(--white)}
.sec-white{background:var(--white);color:var(--navy)}
.sec-orange{background:var(--orange);color:var(--navy)}
.eyebrow{display:block;font:600 13px/1.4 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin-bottom:14px}
.sec-navy .eyebrow,.hero .eyebrow{color:var(--gold)}
h2{font-size:clamp(30px,4.4vw,50px);line-height:1.15;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
html[lang="en"] h2{letter-spacing:-.02em;line-height:1.05}
.lead{font-size:clamp(17px,1.5vw,20px);line-height:1.7;max-width:62ch;color:var(--ink-2)}
.sec-navy .lead,.hero .lead{color:var(--mist)}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 40px;margin-bottom:clamp(32px,4vw,48px)}
.sec-head>div{min-width:0;max-width:720px}
.sec-head .lead{margin-top:14px}
.textlink{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.sec-navy .textlink{color:var(--gold)}
.sec-white .textlink{color:var(--blue)}

/* diagonal edge band at the bottom of navy sections */
.edge{position:absolute;inset-inline:0;bottom:0;height:22px;pointer-events:none}
.edge svg{width:100%;height:100%;display:block}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* ---------- hero (home + inner pages) ---------- */
.hero{position:relative;overflow:hidden;background:var(--navy);color:var(--white);padding-block:var(--pt) var(--pb)}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:center}
.hero-copy{position:relative;z-index:2;min-width:0;display:flex;flex-direction:column;gap:22px}
.hero h1{font-size:clamp(52px,8.4vw,108px);line-height:1.08;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
html[lang="en"] .hero h1{line-height:.95;letter-spacing:-.035em}
.hero .lead{font-size:clamp(17px,1.7vw,21px)}
.facts-row{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:6px;padding-top:22px;border-top:1px solid var(--navy-line)}
.facts-row div{display:flex;flex-direction:column;gap:2px}
.facts-row b{font:600 22px/1.2 var(--f-mono);color:var(--white)}
.facts-row span{font-size:14px;color:var(--mist)}
.hero-art{position:relative;min-height:440px}
.slabs{position:absolute;top:calc(-1 * var(--pt));bottom:calc(-1 * var(--pb));inset-inline-start:0;inset-inline-end:calc(-1 * var(--bleed))}
.slabs svg{width:100%;height:100%;display:block}
.ies-outline{position:absolute;inset-inline-end:calc(-.06em - var(--bleed) + var(--gutter));bottom:calc(-1 * var(--pb) - .14em);direction:ltr;font:700 clamp(170px,25vw,320px)/1 var(--f-en);letter-spacing:-.04em;color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.3);pointer-events:none;user-select:none}
.hero-art .stamp{position:absolute;z-index:2;top:2%;inset-inline-start:10%;width:clamp(130px,17vw,196px);transform:rotate(-12deg)}
.hero-art .sticker{position:absolute;z-index:2;bottom:14%;inset-inline-start:4%}
@media (max-width:860px){
  .hero-grid{grid-template-columns:1fr;gap:28px}
  .hero-art{min-height:300px}
  .slabs{top:0;inset-inline:calc(-1 * var(--gutter))}
  .ies-outline{inset-inline-end:-.06em}
  .hero-art .stamp{top:6%;inset-inline-start:2%}
  .hero-art .sticker{bottom:18%;inset-inline-start:auto;inset-inline-end:6%}
}
.page-hero{padding-block:clamp(44px,6vw,80px) clamp(56px,7vw,92px)}
.page-hero h1{font-size:clamp(44px,6.6vw,84px)}
.page-hero .hero-copy{max-width:760px}
.page-hero .slab-corner{position:absolute;inset-block:0;inset-inline-end:0;width:min(34vw,420px)}
.page-hero .slab-corner svg{width:100%;height:100%;display:block}
@media (max-width:860px){.page-hero .slab-corner{width:28vw;opacity:.9}}
@media (max-width:560px){.page-hero .slab-corner{display:none}.page-hero .edge{display:block}}

/* stamp + sticker + hex badges (shared motifs) */
.stamp{display:block;direction:ltr}
.sticker{display:inline-flex;align-items:center;gap:12px;background:var(--navy);color:var(--white);border-radius:14px;padding:10px 22px 12px;transform:rotate(-6deg);box-shadow:7px 7px 0 var(--gold);white-space:nowrap;direction:ltr}
.sticker span{font:400 clamp(22px,2.6vw,32px)/1 var(--f-marker)}
.sticker span[lang="ar"]{font:700 clamp(22px,2.6vw,32px)/1.2 var(--f-ar)}
.hex{display:block;flex-shrink:0}

/* ---------- what is IES ---------- */
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(32px,6vw,80px);align-items:start}
.split>*{min-width:0}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.prose{display:flex;flex-direction:column;gap:18px}
.prose p{font-size:clamp(17px,1.5vw,19px);line-height:1.8;max-width:62ch;color:var(--ink-2)}
.sec-navy .prose p{color:var(--mist)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 16px;border:2px solid var(--navy);border-radius:999px;font-weight:700;font-size:15px;background:var(--white)}
.chip i{width:8px;height:8px;border-radius:2px;background:var(--orange);transform:rotate(45deg);flex-shrink:0}
.panel{border:2px solid var(--navy);border-radius:22px;padding:clamp(22px,3vw,32px);box-shadow:8px 8px 0 var(--navy);background:var(--white);display:flex;flex-direction:column;gap:18px}
.panel h3{font-size:14px;font-family:var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.big75{display:flex;align-items:center;gap:18px;padding-top:18px;border-top:2px solid var(--rule)}
.big75 b{font:700 64px/1 var(--f-en);letter-spacing:-.04em;color:var(--orange);-webkit-text-stroke:2px var(--navy)}
.big75 span{font-weight:700;font-size:16px;line-height:1.5}

/* ---------- benefits ---------- */
.benefits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:36px 28px}
@media (max-width:980px){.benefits{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.benefits{grid-template-columns:1fr;gap:22px}}
.benefit{display:flex;flex-direction:column;gap:14px;padding-top:22px;border-top:2px solid var(--navy-line)}
.benefit h3{font-size:19px;line-height:1.45;font-weight:700}
.benefit p{font-size:15px;color:var(--mist);line-height:1.6}
@media (max-width:520px){.benefit{flex-direction:row;align-items:center;gap:16px;padding-top:18px}}

/* ---------- events ---------- */
.empty{display:flex;flex-wrap:wrap;align-items:center;gap:22px 28px;border:2px dashed var(--rule);border-radius:24px;padding:clamp(24px,4vw,40px)}
.empty>div{min-width:0;flex:1 1 280px;display:flex;flex-direction:column;gap:8px}
.empty h3{font-size:22px;line-height:1.4}
.empty p{color:var(--ink-2);max-width:60ch}
.sec-navy .empty{border-color:var(--navy-line)}
.sec-navy .empty p{color:var(--mist)}
.events{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:24px}
.event{display:flex;flex-direction:column;gap:10px;border:2px solid var(--navy);border-radius:22px;padding:24px;box-shadow:8px 8px 0 var(--navy);background:var(--white)}
.event .date{font:600 15px/1.3 var(--f-mono);color:var(--blue)}
.event h3{font-size:22px;line-height:1.35}
.event p{color:var(--ink-2)}
.tbd{display:inline-block;font:600 13px/1.4 var(--f-mono);letter-spacing:.06em;background:rgba(255,194,26,.22);color:inherit;border:1px dashed currentColor;border-radius:6px;padding:1px 7px;direction:ltr;unicode-bidi:isolate}

/* ---------- team ---------- */
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:32px}
.mtile{--shadow:var(--navy);position:relative;display:flex;flex-direction:column;background:var(--acc);color:var(--white);border-radius:24px;overflow:hidden;text-decoration:none;box-shadow:8px 8px 0 var(--shadow);transition:transform .18s ease,box-shadow .18s ease;max-width:400px}
.sec-navy .mtile{--shadow:var(--gold)}
.mtile:hover{transform:translate(-3px,-3px);box-shadow:11px 11px 0 var(--shadow)}
.mt-art{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--navy-deep)}
.mt-art img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.mt-art svg{position:absolute;inset:0;width:100%;height:100%}
.mt-art .ies-mini{position:absolute;inset-inline-end:-.05em;bottom:-.16em;direction:ltr;font:700 150px/1 var(--f-en);letter-spacing:-.04em;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.3)}
.mt-frame{position:absolute;inset:10px;border:3px solid var(--gold);border-radius:18px;pointer-events:none;z-index:2}
.mt-body{position:relative;display:flex;flex-direction:column;gap:6px;padding:20px 22px 24px}
.mt-ar{font:700 18px/1.4 var(--f-ar)}
.mt-en{font:700 30px/1 var(--f-en);letter-spacing:-.02em;direction:ltr;text-align:start}
html[lang="ar"] .mt-en{text-align:right}
.mt-spec{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.92}
.mt-id{font:600 15px/1.2 var(--f-mono);opacity:.9;direction:ltr}
html[lang="ar"] .mt-id{text-align:right}
.pill{display:inline-flex;align-items:center;gap:9px;width:fit-content;border-radius:999px;padding:6px 15px;background:var(--navy);color:var(--gold);font:700 13px/1.3 var(--f-en);letter-spacing:.08em;margin-block:6px 4px}
.pill.lead{background:var(--gold);color:var(--navy)}
.pill .div{width:2px;height:16px;background:var(--navy);opacity:.35;border-radius:2px}
html[lang="ar"] .pill{font-family:var(--f-ar);letter-spacing:0;font-size:14px}
.pill-lg{font-size:17px;padding:9px 20px}
html[lang="ar"] .pill-lg{font-size:18px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:36px}
.filter{min-height:44px;padding:8px 18px;border-radius:999px;border:2px solid var(--navy);background:var(--white);color:var(--navy);font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.filter i{width:12px;height:12px;border-radius:3px;background:var(--acc)}
.filter[aria-pressed="true"]{background:var(--navy);color:var(--white)}
.filter:hover{box-shadow:4px 4px 0 var(--navy);transform:translate(-2px,-2px)}
.note{margin-top:36px;color:var(--ink-2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-navy .note{color:var(--mist)}

/* ---------- CTA band ---------- */
.cta{position:relative;overflow:hidden;background:var(--orange);color:var(--navy);padding-block:clamp(56px,7vw,88px)}
.cta .art{position:absolute;inset-block:0;inset-inline-end:0;width:min(46vw,560px)}
.cta .art svg{width:100%;height:100%;display:block}
.cta-in{position:relative;z-index:1;display:flex;flex-direction:column;gap:20px;max-width:620px}
.cta h2{font-size:clamp(34px,5vw,60px)}
.cta p{font-size:clamp(17px,1.5vw,20px);font-weight:500;max-width:48ch}
.cta .btn-navy{--hard:var(--white)}
@media (max-width:700px){.cta .art{display:none}}

/* ---------- member page ---------- */
.m-hero{background:var(--acc)}
.m-hero .hero-grid{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}
.m-hero h1{font-size:clamp(44px,6.4vw,80px);line-height:1.15}
.m-en{font:700 clamp(30px,4vw,48px)/1 var(--f-en);letter-spacing:-.025em;direction:ltr;text-align:start}
html[lang="ar"] .m-en{text-align:right}
html[lang="en"] .m-hero h1{font:700 clamp(52px,7.4vw,96px)/.95 var(--f-en);letter-spacing:-.035em}
html[lang="en"] .m-en{font:700 clamp(24px,3vw,34px)/1.3 var(--f-ar);letter-spacing:0;direction:rtl;text-align:left}
.m-spec{font-weight:700;font-size:clamp(15px,1.4vw,18px);letter-spacing:.08em;text-transform:uppercase}
html[lang="ar"] .m-spec{letter-spacing:0;text-transform:none;font-size:clamp(17px,1.6vw,20px)}
.nfc-chip{display:inline-flex;align-items:center;gap:10px;width:fit-content;background:var(--navy);color:var(--white);border-radius:999px;padding:6px 16px 6px 8px;font-weight:700;font-size:14px}
html[dir="rtl"] .nfc-chip{padding:6px 8px 6px 16px}
.nfc-chip .dot{width:30px;height:30px;border-radius:999px;background:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.m-art{display:flex;align-items:center;justify-content:center}
.m-photo-wrap{position:relative;z-index:2;width:min(320px,74%)}
.m-photo{aspect-ratio:4/5;border:6px solid var(--white);border-radius:26px;overflow:hidden;background:var(--navy-deep);box-shadow:10px 10px 0 var(--mshadow,var(--navy))}
.m-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 10%}
.m-photo .noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font:700 96px/1 var(--f-en);color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.45)}
.m-photo-wrap .stamp{position:absolute;top:-30px;inset-inline-end:-46px;width:clamp(116px,13vw,150px);transform:rotate(-12deg)}
.m-hero .sticker{margin-top:10px}
.m-frame{position:absolute;inset:12px;border:3px solid var(--gold);border-radius:24px;pointer-events:none;z-index:3}
@media (max-width:860px){
  .m-hero .hero-grid{grid-template-columns:1fr}
  .m-art{order:-1;min-height:0;padding-block:8px 18px}
  .m-hero .slabs{top:calc(-1 * var(--pt));bottom:0}
  .m-photo-wrap{width:min(230px,62%)}
  .m-photo-wrap .stamp{inset-inline-end:-58px;top:-18px;width:118px}
}
.m-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,5vw,64px);align-items:start}
.m-body>*{min-width:0;display:flex;flex-direction:column;gap:28px}
@media (max-width:860px){.m-body{grid-template-columns:1fr}}
.m-body h2{font-size:clamp(24px,2.6vw,30px)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:2px solid var(--navy);border-radius:20px;overflow:hidden}
.facts div{padding:18px 22px;display:flex;flex-direction:column;gap:4px;border-inline-end:2px solid var(--rule);border-bottom:2px solid var(--rule);margin:0 -2px -2px 0}
.facts dt{font:700 12px/1.3 var(--f-en);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
html[lang="ar"] .facts dt{font:700 14px/1.4 var(--f-ar);letter-spacing:0;text-transform:none}
.facts dd{font:600 22px/1.25 var(--f-mono);direction:ltr;text-align:start}
html[lang="ar"] .facts dd{text-align:right}
@media (max-width:520px){.facts{grid-template-columns:1fr}.facts div{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px}.facts dd{font-size:19px}}
.badges{display:flex;flex-wrap:wrap;gap:12px 14px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;text-align:center}
.badge b{font-size:15px;line-height:1.2}
.badge small{font-size:12px;color:var(--ink-3);font-weight:500}
.links{display:flex;flex-direction:column;gap:10px}
.link-row{display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 18px;border:2px solid var(--navy);border-radius:16px;text-decoration:none;font-weight:700}
.link-row:hover{background:var(--navy);color:var(--white)}
.link-row span.v{margin-inline-start:auto;font:600 14px/1.2 var(--f-mono);direction:ltr;opacity:.75;overflow-wrap:anywhere}
.status{min-height:24px;font-size:15px;color:var(--ink-2)}
.hint{font-size:15px;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start;max-width:56ch}
.hint svg{flex-shrink:0;margin-top:3px}

/* ---------- join ---------- */
.join-box{border:2px dashed var(--navy);border-radius:24px;padding:clamp(24px,4vw,40px);display:flex;flex-direction:column;gap:16px;background:var(--white)}
.join-box h3{font-size:24px;line-height:1.35}
.join-box p{color:var(--ink-2)}

/* ---------- publications ---------- */
.pubs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:20px}
.pub{display:flex;flex-direction:column;gap:12px;padding:22px;border:2px solid var(--navy-line);border-radius:20px}
.pub .k{font:600 12px/1.3 var(--f-mono);letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.pub h3{font:700 19px/1.35 var(--f-en);direction:ltr;text-align:start}
html[lang="ar"] .pub h3{text-align:right}
.src{margin-top:28px;font-size:15px;color:var(--mist)}
.src a{color:var(--gold);font-weight:700}

/* ---------- footer ---------- */
.foot{background:var(--navy);color:var(--mist);padding-block:56px 40px;border-top:4px solid var(--gold)}
.foot-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:36px}
@media (max-width:860px){.foot-grid{grid-template-columns:1fr}}
.foot-grid>*{min-width:0;display:flex;flex-direction:column;gap:14px}
.foot-logos{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.foot-logos .c{width:64px;height:64px;border-radius:999px;background:var(--white);padding:3px;overflow:hidden}
.foot-logos .c img{width:100%;height:100%;object-fit:contain}
.foot-logos .p{background:var(--white);border-radius:12px;padding:6px 10px}
.foot-logos .p img{height:44px;width:auto}
.foot h3{font:600 12px/1.3 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.foot strong{color:var(--white);font-size:18px}
.foot a{text-decoration:none;color:var(--white);font-weight:500}
.foot a:hover{color:var(--gold)}
.foot ul{display:flex;flex-direction:column;gap:6px}
.foot-bottom{margin-top:44px;padding-top:22px;border-top:1px solid var(--navy-line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:14px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>

<div id="app"></div>

<script>
(() => {
  /* ===== content (generated from data/*.json by tools/build_preview.py) ===== */
  const MEMBERS = /*__MEMBERS__*/[];
  const EVENTS = /*__EVENTS__*/[];

  /* ===== settings still to be filled in ===== */
  const CONFIG = {
    domain: null,        // e.g. "ieshu.org", needed before writing NFC tags
    joinFormUrl: null,   // Google Form or Formspree link
    social: { instagram: null, linkedin: null, facebook: null, email: null }
  };

  const IMG = { ies: "__IES_LOGO__", hu: "__HU_LOGO__", branch: "__BRANCH_LOGO__" };

  const ROLES = {
    chair:  { en: 'CHAIR',          ar: 'الرئيس',          acc: '#0B1530', rank: 3 },
    vice:   { en: 'VICE CHAIR',     ar: 'نائب الرئيس',     acc: '#1449D6', rank: 2 },
    tech:   { en: 'TECHNICAL TEAM', ar: 'الفريق التقني',   acc: '#0B7A75', rank: 0 },
    events: { en: 'EVENTS TEAM',    ar: 'فريق الفعاليات',  acc: '#B0185A', rank: 0 },
    media:  { en: 'MEDIA TEAM',     ar: 'فريق الإعلام',    acc: '#6A2BE0', rank: 0 },
    member: { en: 'MEMBER',         ar: 'عضو',             acc: '#2E3A59', rank: 0 }
  };
  const ROLE_ORDER = Object.keys(ROLES);

  let lang = 'ar';
  try { lang = localStorage.getItem('ies-lang') === 'en' ? 'en' : 'ar'; } catch (e) {}
  let teamFilter = 'all';

  const L = (ar, en) => (lang === 'ar' ? ar : en);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const TBD = (label) => `<span class="tbd">[TBD${label ? ': ' + esc(label) : ''}]</span>`;
  const role = m => ROLES[m.role] || ROLES.member;
  const isLeader = m => role(m).rank > 0;

  /* ===== icons (one stroke style, 24px grid) ===== */
  const ico = (inner, size = 22, stroke = 'currentColor', w = 2) =>
    `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
  const P = {
    star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
    flag: '<path d="M5 21V4h11l-2 4 2 4H5"/>',
    wrench: '<path d="M14.5 6.5a4 4 0 0 0-5.3 5.3L4 17l3 3 5.2-5.2a4 4 0 0 0 5.3-5.3l-2.5 2.5-2.5-.5-.5-2.5z"/>',
    chip: '<path d="M8 8h8v8H8zM10 3v5M14 3v5M10 16v5M14 16v5M3 10h5M3 14h5M16 10h5M16 14h5"/>',
    doc: '<path d="M7 3h7l4 4v14H7zM14 3v4h4M10 12h5M10 16h5"/>',
    network: '<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.5 6h7M7.3 8.3l3.4 7.4M16.7 8.3l-3.4 7.4"/>',
    factory: '<path d="M3 21V10l5 3v-3l5 3v-3l5 3V4h3v17zM3 21h18"/>',
    cv: '<path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h3"/>',
    pen: '<path d="M4 20l4-1 11-11-3-3L5 16zM14 6l3 3"/>',
    nfc: '<path d="M6 8.5a5 5 0 0 1 0 7"/><path d="M9.5 6a9 9 0 0 1 0 12"/><path d="M13 3.5a13 13 0 0 1 0 17"/>',
    menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
    calendar: '<path d="M4 6h16v14H4zM4 10h16M8 3v5M16 3v5"/>',
    mail: '<path d="M3 6h18v12H3zM3 7l9 6 9-6"/>',
    phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
    link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'
  };
  const arrow = (size = 20) => `<span class="flip" style="display:inline-flex">${ico(P.arrow, size)}</span>`;

  const chevrons = rank => rank === 3
    ? '<svg aria-hidden="true" width="16" height="20" viewBox="0 0 20 24" fill="none" stroke="#0B1530" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8l6-5 6 5"/><path d="M4 14l6-5 6 5"/><path d="M4 20l6-5 6 5"/></svg>'
    : '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#0B1530" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5l6-5 6 5"/><path d="M4 15.5l6-5 6 5"/></svg>';

  const rolePill = (m, cls = '') => {
    const r = role(m);
    const lead = r.rank > 0;
    return `<span class="pill ${lead ? 'lead' : ''} ${cls}">${lead ? chevrons(r.rank) + '<span class="div" aria-hidden="true"></span>' : ''}<span>${L(r.ar, r.en)}</span></span>`;
  };

  let uid = 0;
  const stamp = (top, center, ring, label) => {
    const id = 'ring' + (++uid);
    return `<svg class="stamp" role="img" aria-label="${esc(label)}" viewBox="0 0 150 150">
      <defs><path id="${id}" d="M75 75 m-53 0 a53 53 0 1 1 106 0 a53 53 0 1 1 -106 0"/></defs>
      <circle cx="75" cy="75" r="73" fill="#0B1530"/>
      <circle cx="75" cy="75" r="69" fill="none" stroke="#FFC21A" stroke-width="2"/>
      <circle cx="75" cy="75" r="36" fill="#FFC21A"/>
      <text font-family="Space Grotesk, sans-serif" font-size="16" font-weight="700" fill="#FFC21A"><textPath href="#${id}" textLength="328" lengthAdjust="spacing">${ring}</textPath></text>
      <text x="75" y="70" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="700" fill="#0B1530" letter-spacing="0.5">${top}</text>
      <text x="75" y="92" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="21" font-weight="600" fill="#0B1530">${center}</text>
    </svg>`;
  };

  const sticker = (text, isAr) => {
    const s = '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#FFC21A"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.2 5.8 20.9l1.6-7L2 9.2l7.1-.6z"/></svg>';
    return `<div class="sticker">${s}<span ${isAr ? 'lang="ar"' : 'lang="en"'}>${esc(text)}</span>${s}</div>`;
  };

  // hex badge: earned = navy fill + gold stroke/icon; locked = dashed outline
  const hex = (iconPath, earned, size = 58, onDark = false) => {
    const line = earned ? '#FFC21A' : (onDark ? '#FFFFFF' : '#0B1530');
    return `<svg class="hex" aria-hidden="true" width="${size}" height="${Math.round(size * 72 / 64)}" viewBox="0 0 64 72">
      <polygon points="32,3 61,19.5 61,52.5 32,69 3,52.5 3,19.5" fill="${earned ? '#0B1530' : 'none'}" stroke="${line}" stroke-width="3" stroke-dasharray="${earned ? '0' : '6 5'}"/>
      <svg x="20" y="24" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${line}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${iconPath}</svg>
    </svg>`;
  };

  const edge = (onWhiteBelow = true) => `<div class="edge flip" aria-hidden="true"><svg viewBox="0 0 1440 22" preserveAspectRatio="none">
      <polygon points="1050,0 1440,0 1440,22 1040,22" fill="#FF6B1A"/>
      <polygon points="1000,0 1030,0 1020,22 990,22" fill="#FFC21A"/>
      ${onWhiteBelow ? '' : ''}
    </svg></div>`;

  /* ===== shared blocks ===== */
  const BENEFITS = [
    { i: P.wrench,  ar: 'ورش عملية', en: 'Hands-on workshops', dAr: 'Arduino، PLC، MATLAB وإلكترونيات القدرة', dEn: 'Arduino, PLC, MATLAB, power electronics' },
    { i: P.doc,     ar: 'الوصول لأبحاث IEEE', en: 'Access to IEEE research' },
    { i: P.network, ar: 'تواصل مع مهندسين وخريجين', en: 'Networking with engineers and alumni' },
    { i: P.factory, ar: 'زيارات صناعية', en: 'Industry visits' },
    { i: P.flag,    ar: 'خبرة قيادية', en: 'Leadership experience' },
    { i: P.cv,      ar: 'سيرة ذاتية أقوى', en: 'A stronger CV' },
    { i: P.pen,     ar: 'مساعدة في البحث والنشر', en: 'Help with research and publishing' },
    { i: P.chip,    ar: 'مجتمع من ناس بتبني أشياء', en: 'A community of people who build things' }
  ];
  const FIELDS = [
    ['الأتمتة', 'Automation'], ['الروبوتات', 'Robotics'], ['إلكترونيات القدرة', 'Power electronics'],
    ['الأنظمة المدمجة', 'Embedded systems'], ['الصناعة 4.0', 'Industry 4.0'], ['الشبكات الذكية', 'Smart grid'],
    ['الذكاء الاصطناعي الصناعي', 'Industrial AI']
  ];

  const benefitsGrid = () => `<ul class="benefits">${BENEFITS.map(b => `
      <li class="benefit">${hex(b.i, true, 52)}<div><h3>${L(b.ar, b.en)}</h3>${b.dAr ? `<p>${L(b.dAr, b.dEn)}</p>` : ''}</div></li>`).join('')}
    </ul>`;

  const cta = () => `<section class="cta" aria-labelledby="cta-h">
      <div class="art flip" aria-hidden="true"><svg viewBox="0 0 560 400" preserveAspectRatio="xMaxYMid slice">
        <polygon points="300,0 560,0 560,400 140,400" fill="#0B1530"/>
        <polygon points="220,0 262,0 102,400 60,400" fill="#FFC21A"/>
        <g stroke="#FFFFFF" stroke-opacity=".35" stroke-width="3" stroke-linecap="round" fill="none"><path d="M560 90 H470 L430 130 V230"/></g>
        <circle cx="430" cy="230" r="7" fill="#FFFFFF"/>
      </svg></div>
      <div class="wrap"><div class="cta-in">
        <h2 id="cta-h">${L('صير جزء من البصمة', 'Be part of the mark')}</h2>
        <p>${L('شعبة IES في الجامعة الهاشمية بدورتها الأولى 2026/2027. انضم وابنِ معنا.', 'The IES chapter at the Hashemite University is in its first term, 2026/2027. Join and build with us.')}</p>
        <div class="btn-row"><a class="btn btn-navy btn-hard" href="#join">${L('انضم للشعبة', 'Join the chapter')} ${arrow()}</a></div>
      </div></div>
    </section>`;

  const memberTile = m => {
    const r = role(m);
    return `<a class="mtile" href="#m-${esc(m.slug)}" style="--acc:${r.acc}" aria-label="${esc(L(m.nameAr, m.nameEn))}, ${esc(L(r.ar, r.en))}">
      <div class="mt-art">
        ${m.photo ? `<img src="${m.photo}" alt="" loading="lazy">` : `<span class="ies-mini" aria-hidden="true">IES</span>`}
        <svg class="flip" viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true">
          <polygon points="330,0 400,0 400,300 250,300" fill="#FF6B1A"/>
          <polygon points="300,0 316,0 236,300 220,300" fill="#FFC21A"/>
        </svg>
        ${isLeader(m) ? '<div class="mt-frame" aria-hidden="true"></div>' : ''}
      </div>
      <div class="mt-body">
        <div class="mt-ar" lang="ar" dir="rtl">${esc(m.nameAr)}</div>
        <div class="mt-en" lang="en">${esc(m.nameEn)}</div>
        ${rolePill(m)}
        <div class="mt-spec">${esc(L(m.specialtyAr, m.specialtyEn))}</div>
        <div class="mt-id">${esc(m.memberId)}</div>
      </div>
    </a>`;
  };

  const eventsList = (list) => list.length ? `<div class="events">${list.map(e => `
      <article class="event">
        <div class="date mono">${esc(e.date || '')}</div>
        <h3>${esc(L(e.titleAr, e.titleEn))}</h3>
        ${e.locationAr || e.locationEn ? `<p>${esc(L(e.locationAr, e.locationEn))}</p>` : ''}
        ${e.descAr || e.descEn ? `<p>${esc(L(e.descAr, e.descEn))}</p>` : ''}
        ${e.link ? `<a class="textlink" href="${esc(e.link)}" target="_blank" rel="noopener">${L('التفاصيل', 'Details')} ${arrow(18)}</a>` : ''}
      </article>`).join('')}</div>`
    : `<div class="empty">
        ${hex(P.calendar, false, 64)}
        <div><h3>${L('ما في فعاليات معلنة حاليًا', 'No events announced yet')}</h3>
        <p>${L('أول فعاليات الشعبة رح تنزل هون أول ما تنعلن. تابعنا على حساباتنا', 'The chapter’s first events will be listed here as soon as they are announced. Follow us on')} ${TBD(L('روابط السوشال', 'social links'))}</p></div>
      </div>`;

  const upcoming = () => {
    const today = new Date().toISOString().slice(0, 10);
    return EVENTS.filter(e => !e.date || e.date >= today).slice(0, 3);
  };

  /* ===== header / footer ===== */
  const NAV = [['home', 'الرئيسية', 'Home'], ['about', 'عن IES', 'About'], ['team', 'الفريق', 'Team'], ['events', 'الفعاليات', 'Events'], ['join', 'انضم', 'Join']];

  const header = active => `
    <a class="skip" href="#main" data-skip>${L('انتقل للمحتوى', 'Skip to content')}</a>
    <header class="top"><div class="wrap top-in">
      <a class="brand" href="#home" aria-label="${L('IEEE IES · الجامعة الهاشمية، الرئيسية', 'IEEE IES Hashemite University, home')}">
        <span class="brand-pill"><img src="${IMG.ies}" alt="" width="58" height="34"></span>
        <span class="brand-txt">HASHEMITE<br>UNIVERSITY</span>
      </a>
      <nav class="nav" id="nav" aria-label="${L('القائمة الرئيسية', 'Main')}">
        ${NAV.map(([k, ar, en]) => `<a href="#${k}" ${k === active ? 'aria-current="page"' : ''}>${L(ar, en)}</a>`).join('')}
      </nav>
      <div class="top-actions">
        <button type="button" class="lang" id="langBtn" lang="${lang === 'ar' ? 'en' : 'ar'}" aria-label="${L('Switch to English', 'التبديل إلى العربية')}">${lang === 'ar' ? 'EN' : 'عربي'}</button>
        <button type="button" class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav" aria-label="${L('القائمة', 'Menu')}">${ico(P.menu, 22, 'currentColor', 2.4)}</button>
      </div>
    </div></header>`;

  const socialItem = (key, label) => CONFIG.social[key]
    ? `<li><a href="${esc(CONFIG.social[key])}" target="_blank" rel="noopener">${label}</a></li>`
    : `<li>${label} ${TBD()}</li>`;

  const footer = () => `
    <footer class="foot"><div class="wrap">
      <div class="foot-grid">
        <div>
          <div class="foot-logos">
            <span class="p"><img src="${IMG.ies}" alt="IEEE Industrial Electronics Society, HU Student Branch IES Chapter" width="76" height="44"></span>
            <span class="c"><img src="${IMG.branch}" alt="IEEE Hashemite University Student Branch" width="58" height="58"></span>
            <span class="c"><img src="${IMG.hu}" alt="${L('الجامعة الهاشمية', 'The Hashemite University')}" width="58" height="58"></span>
          </div>
          <strong>${L('شعبة IEEE IES الطلابية', 'IEEE IES Student Chapter')}</strong>
          <p>${L('فرع IEEE · الجامعة الهاشمية. الدورة 2026/2027.', 'IEEE Hashemite University Student Branch. Term 2026/2027.')}</p>
        </div>
        <div>
          <h3>${L('الموقع', 'Site')}</h3>
          <ul>${NAV.map(([k, ar, en]) => `<li><a href="#${k}">${L(ar, en)}</a></li>`).join('')}</ul>
        </div>
        <div>
          <h3>${L('تابعنا', 'Follow')}</h3>
          <ul>${socialItem('instagram', 'Instagram')}${socialItem('linkedin', 'LinkedIn')}${socialItem('facebook', 'Facebook')}${socialItem('email', L('البريد', 'Email'))}</ul>
        </div>
      </div>
      <div class="foot-bottom">
        <span>© 2026 IEEE IES · ${L('الجامعة الهاشمية', 'Hashemite University')}</span>
        <span class="ltr">Built to Connect · جزء من البصمة</span>
      </div>
    </div></footer>`;

  /* ===== pages ===== */
  const pageHero = (eyebrow, title, lead) => `
    <section class="hero page-hero">
      <div class="slab-corner flip" aria-hidden="true"><svg viewBox="0 0 420 400" preserveAspectRatio="xMaxYMid slice">
        <polygon points="230,0 420,0 420,400 110,400" fill="#FF6B1A"/>
        <polygon points="160,0 196,0 76,400 40,400" fill="#FFC21A"/>
        <g stroke="#FFFFFF" stroke-opacity=".35" stroke-width="3" stroke-linecap="round" fill="none"><path d="M0 330 H40 L70 300 H120"/></g>
      </svg></div>
      <div class="wrap"><div class="hero-copy">
        <span class="eyebrow">${eyebrow}</span>
        <h1>${title}</h1>
        ${lead ? `<p class="lead">${lead}</p>` : ''}
      </div></div>
      ${edge()}
    </section>`;

  const home = () => `
    <section class="hero" aria-labelledby="hero-h">
      <div class="wrap hero-grid">
        <div class="hero-copy">
          <span class="eyebrow">IEEE IES · ${L('الجامعة الهاشمية', 'Hashemite University')}</span>
          <h1 id="hero-h">${L('جزء من البصمة', 'Built to Connect')}</h1>
          <p class="lead">${L(
            'شعبة طلابية جديدة لجمعية الإلكترونيات الصناعية في IEEE، تابعة لفرع IEEE الطلابي في الجامعة الهاشمية. نتعلّم الأتمتة والروبوتات والأنظمة المدمجة بالتجربة العملية، ونبنيها معًا.',
            'A new student chapter of the IEEE Industrial Electronics Society at the Hashemite University. We learn automation, robotics and embedded systems by building them, together.')}</p>
          <div class="btn-row">
            <a class="btn btn-gold" href="#join">${L('انضم للشعبة', 'Join the chapter')} ${arrow()}</a>
            <a class="btn btn-outline" href="#about">${L('شو هي IES؟', 'What is IES?')}</a>
          </div>

    const out = ['BEGIN:VCARD', 'VERSION:3.0',
      `N:${vEsc(last)};${vEsc(parts.join(' '))};;;`, `FN:${vEsc(m.nameEn)}`,
      'ORG:IEEE IES Student Chapter\\, Hashemite University', `TITLE:${vEsc(role(m).en)}`,
      `NOTE:${vEsc(m.nameAr + ' · ' + m.specialtyEn + ' · ' + m.memberId)}`];

    if (vb) vb.onclick = () => {
      const m = MEMBERS.find(x => x.slug === route.slice(2));
      const msg = document.getElementById('vcfMsg');
      try {
        const url = URL.createObjectURL(new Blob([vcard(m)], { type: 'text/vcard;charset=utf-8' }));
        const a = Object.assign(document.createElement('a'), { href: url, download: `${m.slug}.vcf` });
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        msg.textContent = L('تم تجهيز ملف جهة الاتصال. افتحه لتحفظه على جوالك.', 'Contact file ready. Open it to save to your phone.');
      } catch (e) {
        msg.textContent = L('ما قدرنا نجهّز الملف بهاد المتصفح.', 'Could not create the file in this browser.');
      }
    };
  }

  window.addEventListener('hashchange', () => {
    if (location.hash === '#main') return;
    render();
    window.scrollTo(0, 0);
  });
  render();
})();
</script>
