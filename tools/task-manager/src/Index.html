<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>IES HU Tasks</title>
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#0B1530;--navy-2:#16244A;--ink:#0B1530;--ink-2:#4A5468;--ink-3:#6B7385;--line:#DDE2EA;--paper:#F4F6FA;--white:#fff;
  --gold:#FFC21A;--orange:#FF6B1A;--blue:#1449D6;--green:#13795B;--red:#C0262D;
  --p-low:#6B7385;--p-medium:#1449D6;--p-high:#E2570B;--p-urgent:#C0262D;
  --radius:14px;--shadow:0 1px 2px rgba(11,21,48,.06),0 6px 18px rgba(11,21,48,.06);
  --font:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none!important}

/* ---------- buttons, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--navy);background:var(--white);color:var(--navy);font-weight:600;white-space:nowrap}
.btn:hover{background:var(--paper)}
.btn-primary{background:var(--gold);border-color:var(--gold)}
.btn-primary:hover{background:#FFD45C}
.btn-dark{background:var(--navy);color:#fff}
.btn-dark:hover{background:var(--navy-2)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-danger{border-color:var(--red);color:var(--red)}
.btn-sm{min-height:32px;padding:4px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:999px;border:0;background:transparent;color:inherit}
.icon-btn:hover{background:rgba(11,21,48,.07)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;min-height:40px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.input:focus{border-color:var(--blue);outline:none}
textarea.input{min-height:96px;resize:vertical}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--navy)}

/* ---------- layout */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--navy);color:#fff;display:flex;flex-direction:column;gap:6px;padding:16px 12px;z-index:40}
.side-brand{display:flex;align-items:center;gap:10px;font-weight:700;padding:4px 6px 14px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:6px}
.side-brand small{display:block;font-weight:500;color:#B9C3D6;font-size:12px}
.side-close{display:none;margin-inline-start:auto;color:#fff}
.side .tabs{display:flex;flex-direction:column;gap:2px;margin:0;overflow:visible}
.side .tab{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;text-align:start;font-size:15px;color:#C9D2E3}
.side .tab:hover{background:rgba(255,255,255,.08);color:#fff}
.side .tab[aria-current="page"]{background:#fff;color:var(--navy)}
.side .tab .count{margin-inline-start:auto;background:var(--gold);color:var(--navy);border-radius:999px;font-size:12px;padding:1px 8px}
.side-sec{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.1)}
.side-sec p{margin:0 0 4px;padding:0 12px;font-size:12px;font-weight:700;color:#8F9AB3;text-transform:uppercase;letter-spacing:.4px}
.side-link{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#C9D2E3;padding:8px 12px;border-radius:10px;text-align:start;font:inherit;font-size:14px;text-decoration:none;cursor:pointer}
.side-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-link:hover,.side-link.on{background:rgba(255,255,255,.08);color:#fff}
.side-foot{margin-top:auto;padding-top:10px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:2px}
.side-foot .who{display:flex;align-items:center;gap:10px;padding:6px 12px 10px}
.side-foot .who small{display:block;color:#8F9AB3;font-size:12px}
.side-scrim{display:none}
.content{min-width:0}
.burger{display:none;position:relative}
.top-title{display:none;font-weight:800;font-size:18px;color:var(--ink)}
.bell{position:relative}
.bell-n{position:absolute;top:1px;inset-inline-end:-2px;min-width:18px;height:18px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:800;line-height:15px;text-align:center;padding:0 4px;border:2px solid #fff}
.dot-badge{position:absolute;top:8px;inset-inline-end:8px;width:9px;height:9px;border-radius:50%;background:var(--gold)}
.topbar{position:sticky;top:0;z-index:20;background:rgba(244,246,250,.92);backdrop-filter:blur(8px);color:var(--ink);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px;padding:10px 20px;max-width:1500px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand-mark{display:block;width:38px;height:38px;border-radius:50%;background:#fff var(--logo-mark) center/88% no-repeat;flex:none}
.brand small{display:block;font-weight:500;color:#B9C3D6;font-size:12px;line-height:1.1}
.tabs{display:flex;gap:4px;margin-inline-start:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:#C9D2E3;padding:8px 14px;border-radius:999px;font-weight:600;white-space:nowrap}
.tab:hover{color:#fff;background:rgba(255,255,255,.08)}
.tab[aria-current="page"]{background:#fff;color:var(--navy)}
.top-actions{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.topbar .icon-btn{color:var(--ink)}
.topbar .icon-btn:hover{background:#E6E9F0}
.avatar{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:999px;color:#fff;font-size:12px;font-weight:700;flex:none;border:2px solid #fff}
.avatars{display:flex}
.avatars .avatar{margin-inline-start:-8px}
.avatars .avatar:first-child{margin-inline-start:0}
.main{max-width:1500px;margin:0 auto;padding:18px 24px 40px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.toolbar .input{width:auto;min-width:150px;min-height:38px}
.toolbar .search{flex:1 1 220px;max-width:340px}
.page-title{font-size:22px;margin:0 0 14px;font-weight:700}
.muted{color:var(--ink-3)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3);border:2px dashed var(--line);border-radius:var(--radius);background:#fff}

/* ---------- board */
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;align-items:start}
.col{background:#E9EDF4;border-radius:var(--radius);padding:10px;min-height:200px;transition:background .15s}
.col.drop{background:#DCE6FB;outline:2px dashed var(--blue)}
.col-head{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-weight:700}
.col-head .dot{width:10px;height:10px;border-radius:99px}
.col-head .count{margin-inline-start:auto;background:#fff;border-radius:999px;padding:0 9px;font-size:13px;color:var(--ink-2)}
.col-add{width:100%;border:1.5px dashed #B8C2D3;background:transparent;border-radius:10px;padding:8px;color:var(--ink-2);font-weight:600;margin-top:6px}
.col-add:hover{background:#fff}
.cards{display:flex;flex-direction:column;gap:10px}
.card{position:relative;background:#fff;border-radius:12px;padding:12px 12px 10px;box-shadow:var(--shadow);border-inline-start:4px solid var(--p-medium);cursor:pointer;text-align:start;width:100%;border-top:0;border-bottom:0;border-inline-end:0}
.card:hover{box-shadow:0 2px 4px rgba(11,21,48,.08),0 10px 24px rgba(11,21,48,.1)}
.card.dragging{opacity:.4}
.card h3{margin:4px 0 8px;font-size:15px;line-height:1.35;font-weight:600;overflow-wrap:anywhere}
.card.done h3{text-decoration:line-through;color:var(--ink-3)}
.p-low{border-inline-start-color:var(--p-low)}.p-medium{border-inline-start-color:var(--p-medium)}.p-high{border-inline-start-color:var(--p-high)}.p-urgent{border-inline-start-color:var(--p-urgent)}
.card-top,.card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.card-title{all:unset;display:block;cursor:pointer;margin:4px 0 8px;font-size:15px;line-height:1.35;font-weight:600;overflow-wrap:anywhere;color:var(--ink)}
.card-title:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.card.done .card-title{text-decoration:line-through;color:var(--ink-3)}
.adv{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:700;color:var(--navy);cursor:pointer;white-space:nowrap}
.adv:hover{border-color:var(--navy)}.adv.to-done{border-color:#13795B;color:#13795B}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.status-tabs{display:none}
.chip.prj{background:#EEF2FF;color:#3730A3}
.proj-filter{border:0;cursor:pointer;font:inherit;font-size:13px;padding:6px 12px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.page-head .page-title{margin:0}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.proj{background:#fff;border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.proj.archived{opacity:.6}
.proj-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.proj h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.proj-date{display:flex;align-items:center;gap:6px;font-size:14px}
.proj-desc{margin:0;color:var(--ink-2);font-size:14px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.proj-stats{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.proj-stats .late{color:var(--red);font-weight:700}
.proj-actions{display:flex;gap:8px;margin-top:auto}
.inbox{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow-y:auto}
.inbox-item{display:flex;flex-direction:column;gap:2px;text-align:start;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;cursor:pointer}
.inbox-item.new{border-color:var(--gold);background:#FFFBEB}
.inbox-item time{font-size:12px;color:var(--ink-3)}
.mention{color:var(--blue);font-weight:700}
.mention-box{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow);margin-top:6px;overflow:hidden}
.mention-box[hidden]{display:none}
.mention-box button{display:flex;align-items:center;gap:8px;border:0;background:#fff;padding:8px 12px;font:inherit;text-align:start;cursor:pointer;min-height:40px}
.mention-box button:hover{background:var(--paper)}
.feed-steps{font-size:14px;line-height:1.8}
.feed-steps ol{margin:8px 0;padding-inline-start:20px}
.card-foot .avatars{min-height:24px}
.day .dots{display:none}.agenda{display:none}
.day.sel{outline:2px solid var(--blue)}
.view-title{font-size:24px;line-height:1.35;margin:2px 0 10px;overflow-wrap:anywhere}
.view-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-weight:700;font-size:13px;background:var(--paper);color:var(--ink-2)}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.next-btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;padding:15px;font:inherit;font-size:17px;font-weight:800;border-radius:14px;background:var(--navy);color:#fff;border:0;cursor:pointer;box-shadow:0 6px 18px rgba(11,21,48,.18)}
.next-btn:hover{filter:brightness(1.12)}.next-btn.to-done{background:#13795B}
.done-note{background:#E7F5EF;color:#13795B;font-weight:800;border-radius:14px;padding:14px;text-align:center}
.stage-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 4px;font-size:13px;color:var(--ink-3)}
.stage-row .seg button{padding:3px 10px;font-size:12.5px}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:10px 16px;margin:18px 0;padding:14px 16px;border:1px solid var(--line);border-radius:14px}
.facts dt{color:var(--ink-3);font-size:13.5px}.facts dd{margin:0;font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.view-desc{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;font-size:15.5px;background:var(--paper);border-radius:12px;padding:12px 14px;margin:0}
.view-desc a{color:var(--blue)}
.v-steps{display:flex;flex-direction:column}
.v-step{display:flex;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
.v-step input{width:22px;height:22px;accent-color:#13795B;flex:none}
.v-step.done span{text-decoration:line-through;color:var(--ink-3)}
.view-sec{margin-top:18px}.view-sec>h3{font-size:14px;color:var(--ink-2);margin:0 0 8px}
.filter-toggle{display:none}.filter-extra{display:contents}
.tip{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#FFF8E6;border:1px solid #FFE3A3;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px;line-height:1.6}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.seg.prio button[aria-pressed="true"][data-v="low"]{background:var(--p-low);border-color:var(--p-low)}
.seg.prio button[aria-pressed="true"][data-v="high"]{background:var(--p-high);border-color:var(--p-high)}
.seg.prio button[aria-pressed="true"][data-v="urgent"]{background:var(--p-urgent);border-color:var(--p-urgent)}
.seg.prio button[aria-pressed="true"][data-v="medium"]{background:var(--p-medium);border-color:var(--p-medium)}
details.more{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.more summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2)}
details.more[open] summary{margin-bottom:12px}
details.more .field{margin-bottom:12px}
.cl-add{display:flex;gap:8px}.cl-add .input{flex:1}
.me-tag{font-size:11px;font-weight:700;color:var(--ink-3)}
.attach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:8px}
.thumb{position:relative;display:block;border-radius:10px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;background:var(--paper)}
.thumb a{color:inherit;text-decoration:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.noimg a::before{content:'IMG';position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:13px;color:#6A2BE0;background:#F1EAFD}
.thumb.noimg img{display:none}
.thumb span{position:absolute;inset:auto 0 0 0;background:linear-gradient(transparent,rgba(11,21,48,.75));color:#fff;font-size:11px;padding:14px 6px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.file-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff}
.file-row a{color:var(--ink);font-weight:600;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.file-row a:hover{text-decoration:underline}
.file-row small{color:var(--ink-3);white-space:nowrap}
.file-ico{flex:none;font-weight:800;font-size:10.5px;letter-spacing:.3px;color:#fff;background:var(--ink-2);border-radius:6px;padding:6px 0;width:40px;text-align:center}
.file-ico.pdf{background:#C0262D}.file-ico.doc{background:#1449D6}.file-ico.xls{background:#13795B}.file-ico.ppt{background:#E2570B}.file-ico.img{background:#6A2BE0}
.file-row.busy{opacity:.7}.file-row.busy .file-ico{background:var(--line);color:var(--ink-2)}
.x-btn{flex:none;border:0;background:transparent;color:var(--ink-3);cursor:pointer;border-radius:999px;width:28px;height:28px;display:grid;place-items:center}
.x-btn:hover{background:var(--paper);color:var(--red)}
.thumb .x-btn{position:absolute;top:4px;inset-inline-end:4px;background:rgba(255,255,255,.92);color:var(--ink)}
.drawer.dragover::after{content:attr(data-drop);position:absolute;inset:10px;border:3px dashed var(--blue);border-radius:16px;background:rgba(20,73,214,.08);display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--blue);pointer-events:none;z-index:5}
.card-meta{font-size:12.5px;color:var(--ink-3);justify-content:space-between}
.meta-items{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.meta-items span{display:inline-flex;align-items:center;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;background:var(--paper);color:var(--ink-2);font-size:12px;font-weight:600}
.chip.blocked{background:#FDE8E9;color:var(--red)}
.chip.label{background:#EEF2FF;color:#3346A6}
.due.overdue{color:var(--red);font-weight:700}
.due.today{color:#A84306;font-weight:700}

/* ---------- list */
.table-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--ink-2);font-weight:700;background:#FAFBFD;white-space:nowrap}
th button{border:0;background:transparent;font-weight:700;color:inherit;padding:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:#F7F9FD}
.prio{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.prio i{width:8px;height:8px;border-radius:99px;display:inline-block}
.status-pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700}
.st-todo{background:#EEF1F6;color:#4A5468}.st-doing{background:#E3ECFF;color:#1449D6}.st-review{background:#FFF1D6;color:#8A5A00}.st-done{background:#DFF3EA;color:#13795B}

/* ---------- my tasks */
.group{margin-bottom:22px}
.group h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.group h2 .count{background:#fff;border-radius:999px;padding:0 9px;font-size:13px;color:var(--ink-2)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}

/* ---------- calendar */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-head h2{margin:0;font-size:18px;min-width:170px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:12px;font-weight:700;color:var(--ink-2);text-align:center;padding:4px}
.day{min-height:104px;background:#fff;border-radius:10px;padding:6px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.day.other{opacity:.45}
.day.today{outline:2px solid var(--gold)}
.day .n{font-size:12px;font-weight:700;color:var(--ink-3)}
.day button{border:0;text-align:start;font-size:12px;padding:2px 6px;border-radius:6px;background:var(--paper);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-inline-start:3px solid var(--p-medium)}
.day button.is-done{text-decoration:line-through;opacity:.6}

/* ---------- dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:30px;line-height:1.1}
.kpi span{color:var(--ink-2);font-size:13px;font-weight:600}
.kpi.warn b{color:var(--red)}
.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.panel{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.panel h2{font-size:16px;margin:0 0 12px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;margin-bottom:9px;font-size:14px}
.bar{height:10px;background:var(--paper);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* ---------- team admin */
.admin-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:start}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--paper);color:var(--ink-2)}
.badge.admin{background:#FFF1D6;color:#8A5A00}
.badge.off{background:#FDE8E9;color:var(--red)}

/* ---------- drawer & modals */
.scrim{position:fixed;inset:0;background:rgba(11,21,48,.45);z-index:40}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(560px,100vw);background:#fff;z-index:41;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.25)}
.drawer-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.drawer-head .id{font-weight:700;color:var(--ink-3);font-size:13px}
.drawer-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.drawer-foot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:#FAFBFD;flex-wrap:wrap}
.title-input{font-size:20px;font-weight:700;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:6px 0;width:100%}
.title-input:focus{outline:none;border-color:var(--blue)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;background:#fff;font-size:13px;font-weight:600}
[dir="rtl"] .person{padding:3px 4px 3px 10px}
.person .avatar{width:24px;height:24px;font-size:10px;border:0}
.person[aria-pressed="true"]{border-color:var(--navy);background:#EEF2FF}
.checklist{display:flex;flex-direction:column;gap:6px}
.cl-item{display:flex;align-items:center;gap:8px}
.cl-item input[type=text]{flex:1;border:0;border-bottom:1px solid transparent;padding:4px 0;background:transparent}
.cl-item input[type=text]:focus{outline:none;border-color:var(--line)}
.cl-item.done input[type=text]{text-decoration:line-through;color:var(--ink-3)}
.progress{height:6px;background:var(--paper);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green)}
.section-title{font-size:13px;font-weight:700;color:var(--ink-2);margin:6px 0 0;text-transform:uppercase;letter-spacing:.04em}
.comment{background:var(--paper);border-radius:10px;padding:10px 12px}
.comment b{font-size:13px}
.comment time{font-size:12px;color:var(--ink-3);margin-inline-start:6px}
.comment p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.activity{list-style:none;margin:0;padding:0;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.activity time{color:var(--ink-3);font-size:12px}
.modal{position:fixed;z-index:51;top:50%;left:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-size:19px}
.modal-scrim{z-index:50}
.code-box{font:700 28px/1 ui-monospace,Menlo,monospace;letter-spacing:4px;text-align:center;padding:16px;border-radius:12px;background:var(--paper);direction:ltr;user-select:all}
.menu{position:absolute;inset-inline-end:16px;top:58px;background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.2);min-width:240px;padding:8px;z-index:30}
.menu button,.menu a{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;padding:10px 12px;border-radius:10px;text-align:start;color:inherit;text-decoration:none}
.menu button:hover,.menu a:hover{background:var(--paper)}
.menu .who{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .who b{display:block}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.3);font-weight:600;max-width:calc(100vw - 32px)}
.toast.error{background:var(--red);color:#fff}
.toast-undo{margin-inline-start:10px;border:0;background:transparent;color:var(--gold);font:inherit;font-weight:800;text-decoration:underline;cursor:pointer;padding:6px 4px}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--ink-3)}
.spinner{width:34px;height:34px;border-radius:99px;border:3px solid var(--line);border-top-color:var(--navy);animation:spin 1s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--navy);background-image:linear-gradient(115deg,var(--navy) 0 62%,var(--gold) 62% 64%,var(--navy) 64% 68%,var(--orange) 68%)}
.login-card{width:min(420px,100%);background:#fff;border-radius:22px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:16px}
.login-card h1{margin:0;font-size:24px}
.login-logo{display:block;width:min(260px,80%);height:auto;margin:4px auto 0}
.login-card .brand{justify-content:center;text-align:center}
.error{color:var(--red);font-weight:600;font-size:14px;min-height:1.2em}
.lang-switch{align-self:flex-start;font-size:13px}

/* ---------- small screens */
@media (max-width:900px){
  .status-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#E6E9F0;border-radius:12px;padding:4px;margin-bottom:12px}
  .status-tabs button{border:0;background:transparent;border-radius:9px;padding:8px 2px;font-weight:700;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:2px}
  .status-tabs button[aria-selected="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .status-tabs b{font-size:15px}
  .board{display:block}
  .board .col{display:none}
  .board .col.on{display:block}
  .board .col-head{display:none}
  .filter-toggle{display:inline-flex}
  /* iPhone zooms into any field with text under 16px: keep fields at 16px on phones */
  .input,input,select,textarea{font-size:16px!important}
  /* finger-sized targets */
  .adv{min-height:38px;padding:6px 16px;font-size:14px}
  .seg button,.stage-row .seg button{min-height:38px;padding:6px 14px;font-size:14px}
  .person{min-height:40px}
  .btn-sm{min-height:38px}
  .icon-btn{min-width:42px;min-height:42px}
  .v-step{padding:12px 2px}.v-step input{width:24px;height:24px}
  .x-btn{width:36px;height:36px}
  /* list: one card per task instead of a squeezed table */
  .table-wrap{overflow:visible;background:transparent;box-shadow:none;border:0}
  .table-wrap table,.table-wrap tbody{display:block}
  .table-wrap thead{display:none}
  .table-wrap tr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
  .table-wrap td{display:block;padding:0;border:0}
  .table-wrap td:first-child{flex-basis:100%;font-size:15px}
  /* calendar: dots in the month, the chosen day's tasks below */
  .day{min-height:52px;padding:5px;gap:2px;cursor:pointer}
  .day button,.day>.muted{display:none}
  .day .dots{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
  .day .dots i{width:7px;height:7px;border-radius:50%}
  .day .dots b{font-size:10px;line-height:1;color:var(--ink-3)}
  .agenda{display:block;margin-top:16px}
  .agenda h2{font-size:16px;margin:0 0 10px}
  .filter-extra{display:none}
  .filter-extra.open{display:contents}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .panels,.admin-grid{grid-template-columns:1fr}
  /* phones: the sidebar becomes a drawer behind the ☰ button */
  .shell{display:block}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:min(300px,84vw);height:100%;transform:translateX(105%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  [dir="ltr"] .side{transform:translateX(-105%)}
  .side-open .side{transform:none;visibility:visible;transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .side-open .side-scrim{display:block;position:fixed;inset:0;background:rgba(11,21,48,.45);z-index:35}
  .side-close{display:grid}
  .side .tab,.side-link{min-height:44px}
  .burger{display:grid}
  .topbar{background:var(--navy);color:#fff;border-bottom:0}
  .topbar .icon-btn{color:#fff}
  .topbar .icon-btn:hover{background:rgba(255,255,255,.12)}
  .top-title{display:block;color:#fff;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar-in{padding:10px 14px}
  .main{padding:14px 14px calc(30px + env(safe-area-inset-bottom))}
  .row2{grid-template-columns:1fr}
  .new-label{display:none}
  .toolbar{gap:8px}
  .toolbar .search{flex:1 1 100%;max-width:none}
  .toolbar .input{flex:1 1 28%;min-width:0;font-size:14px;padding-inline:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

// =============================================================================== server calls
function api(fn, ...args) {
  return new Promise((resolve, reject) => {
    const withToken = fn === 'api_publicInfo' || fn === 'api_login' ? args : [S.token, ...args];
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(e => {
        const msg = String((e && e.message) || e);
        const m = /(AUTH|BAD_CODE|LOCKED|FORBIDDEN|NOT_FOUND|CONFLICT:[\w,]+|BAD_INPUT:[\w-]+)/.exec(msg);
        const code = m ? m[1].replace('BAD_INPUT:', '').replace(/^CONFLICT:.*/, 'CONFLICT') : (/network|NetworkError|Failed to fetch/i.test(msg) ? 'offline' : 'generic');
        if (code === 'AUTH' && fn !== 'api_login') signOut(true);
        reject(Object.assign(new Error(msg), { code, fields: m && m[1].startsWith('CONFLICT:') ? m[1].slice(9).split(',') : [] }));
      })[fn](...withToken);
  });
}

const logoSrc = k => { const b = LOGO[k].replace(/-/g, '+').replace(/_/g, '/'); return 'data:image/png;base64,' + b + '='.repeat((4 - b.length % 4) % 4); };
document.documentElement.style.setProperty('--logo-mark', 'url("' + logoSrc('mark') + '")');
const COLORS = ['#1449D6', '#E2570B', '#13795B', '#6A2BE0', '#B0185A', '#0B7A75', '#8B5E00', '#2E3A59'];
const colorOf = id => COLORS[[...String(id)].reduce((n, c) => n + c.charCodeAt(0), 0) % COLORS.length];
const initials = name => String(name || '?').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const member = id => S.members.find(m => m.id === id);
const avatar = id => { const m = member(id); return m ? `<span class="avatar" style="background:${colorOf(id)}" title="${esc(m.name)}">${esc(initials(m.name))}</span>` : ''; };
const todayStr = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Amman', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
const ammanDay = iso => { if (!iso) return ''; try { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Amman', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(iso)); } catch (e) { return String(iso).slice(0, 10); } };
// Done in the last 7 days = today and the 6 days before it, by the date in Amman (completedAt is stored in UTC).
const doneInLast7 = x => { if (x.status !== 'done' || !x.completedAt) return false; const d = ammanDay(x.completedAt), today = todayStr(); return d >= addDays(today, -6) && d <= today; };
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const fmtDay = d => { if (!d) return ''; const [y, m, day] = d.split('-').map(Number); return `${day} ${t('months')[m - 1].slice(0, S.lang === 'ar' ? 20 : 3)}${y !== Number(todayStr().slice(0, 4)) ? ' ' + y : ''}`; };
const fmtTime = iso => { if (!iso) return ''; try { return new Intl.DateTimeFormat(S.lang === 'ar' ? 'ar-JO-u-nu-latn' : 'en-GB', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Amman' }).format(new Date(iso)); } catch (e) { return iso; } };
const dueClass = tk => !tk.due || tk.status === 'done' ? '' : tk.due < todayStr() ? 'overdue' : tk.due === todayStr() ? 'today' : '';
const prioColor = p => `var(--p-${p})`;
const statusColor = { todo: '#6B7385', doing: '#1449D6', review: '#D99A00', done: '#13795B' };

function toast(msg, error, undo) {
  const el = $('#toast');
  el.textContent = msg;
  S.undo = undo || null;
  if (undo) { const b = document.createElement('button'); b.type = 'button'; b.className = 'toast-undo'; b.dataset.action = 'undo'; b.textContent = t('undo'); el.append(' ', b); }
  el.className = 'toast' + (error ? ' error' : '');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { el.classList.add('hidden'); S.undo = null; }, error || undo ? 5000 : 2400);
}
// Known errors get a plain message; anything else also shows the server's words, so a problem can be reported.
const conflictText = fields => { const names = { team: 'teamField', blocked: 'isBlocked' }; return t('err').CONFLICT.replace('{f}', (fields || []).map(k => t(names[k] || k)).join(S.lang === 'ar' ? '، ' : ', ')); };
const fail = e => e.code === 'CONFLICT' ? toast(conflictText(e.fields), true) : toast(errText(e.code) + (e.code === 'generic' && e.message ? ' (' + String(e.message).replace(/^(Exception|Error):\s*/, '').slice(0, 140) + ')' : ''), true);

function applyLang() {
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
}

// =============================================================================== boot & sign-in
function boot() {
  applyLang();
  $('#boot-msg').textContent = t('loading');
  if (S.token) return loadAll().catch(() => showLogin());
  showLogin();
}

function showLogin(errorMsg) {
  api('api_publicInfo').then(info => {
    $('#app').innerHTML = `
      <main class="login">
        <form class="login-card" id="login-form" novalidate>
          <button type="button" class="btn btn-sm btn-ghost lang-switch" data-action="lang">${t('language')}</button>
          <img class="login-logo" src="${logoSrc('full')}" alt="IEEE Industrial Electronics Society · IEEE HU Student Branch IES Chapter" width="360" height="202">
          <div class="brand"><div><div>${esc(info.appName)}</div><small style="color:var(--ink-3)">${t('appSub')}</small></div></div>
          <h1>${t('signIn')}</h1>
          <label class="field"><span>${t('whoAreYou')}</span>
            <select class="input" id="login-who" required><option value="">${t('chooseName')}</option>
              ${info.members.map(m => `<option value="${esc(m.id)}" ${saved.get('ies-tasks-last') === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}
            </select></label>
          <label class="field"><span>${t('code')}</span>
            <input class="input" id="login-code" autocomplete="current-password" inputmode="text" autocapitalize="none" spellcheck="false" dir="ltr" required>
            <small class="muted">${t('codeHelp')}</small></label>
          <p class="error" id="login-error" role="alert">${esc(errorMsg || '')}</p>
          <button class="btn btn-dark" type="submit">${t('enter')}</button>
          <p class="muted" style="margin:0;font-size:13px">${t('noCode')}</p>
        </form>
      </main>`;
    $('#login-form').addEventListener('submit', e => {
      e.preventDefault();
      const who = $('#login-who').value, code = $('#login-code').value;
      if (!who || !code) return ($('#login-error').textContent = errText('BAD_CODE'));
      const btn = e.target.querySelector('[type=submit]');
      btn.disabled = true;
      api('api_login', who, code).then(r => {
        S.token = r.token;
        saved.set('ies-tasks-token', r.token);
        saved.set('ies-tasks-last', who);
        return loadAll();
      }).catch(err => { btn.disabled = false; $('#login-error').textContent = errText(err.code); });
    });
  }).catch(e => { $('#app').innerHTML = `<div class="loading"><p>${esc(errText(e.code))}</p></div>`; });
}

function signOut(expired) {
  S.token = null; S.me = null;
  saved.del('ies-tasks-token');
  clearInterval(S.poll);
  $('#layer').innerHTML = '';
  showLogin(expired ? errText('AUTH') : '');
}

function loadAll() {
  return api('api_bootstrap').then(d => {
    S.me = d.me; S.members = d.members; S.settings = d.settings; S.statuses = d.statuses; S.priorities = d.priorities;
    S.tasks = new Map(d.tasks.map(x => [x.id, x]));
    S.projects = d.projects || []; S.inbox = d.inbox || [];
    S.lastSync = d.serverTime;
    if (S.view === 'team' && !S.me.admin) S.view = 'board';
    if (!saved.get('ies-tasks-view') && !S.me.admin) S.view = 'mine'; // members first see what is theirs
    render();
    clearInterval(S.poll);
    S.poll = setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 45000);
    try { google.script.url.getLocation(loc => { const m = /task=([\w-]+)/.exec(loc.hash || ''); if (m && S.tasks.has(m[1])) openTask(m[1]); }); } catch (e) {}
  });
}

function sync(manual) {
  if (!S.token) return;
  return api('api_changes', S.lastSync).then(d => {
    d.tasks.forEach(x => S.tasks.set(x.id, x));
    d.archivedIds.forEach(id => S.tasks.delete(id));
    const before = unreadCount() + ':' + (S.projects || []).map(p => p.id + p.name + p.archived).join();
    S.projects = d.projects || S.projects; S.inbox = d.inbox || S.inbox;
    const shellChanged = before !== unreadCount() + ':' + (S.projects || []).map(p => p.id + p.name + p.archived).join();
    // An open read view follows changes made by others, unless the member is typing a comment.
    const typing = document.activeElement && document.activeElement.id === 'c-new';
    if (D && D.view && !typing && (d.tasks.some(x => x.id === D.id) || d.archivedIds.includes(D.id))) renderDrawerKeepScroll();
    S.members = d.members;
    const mine = d.members.find(m => m.id === S.me.id);
    if (mine) Object.assign(S.me, { notify: mine.notify, email: mine.email });
    S.lastSync = d.serverTime;
    if (shellChanged && !(document.activeElement && document.activeElement.matches('input, textarea, select'))) render(); else renderMain();
    if (manual) toast('✓');
  }).catch(e => { if (manual) fail(e); });
}

// =============================================================================== render: shell

  <div class="shell ${S.side ? 'side-open' : ''}">
    <aside class="side" id="side" aria-label="${t('menu')}">
      <div class="side-brand"><span class="brand-mark" role="img" aria-label="IEEE IES HU"></span><div>${esc(S.settings.appName)}<small>${t('appSub')}</small></div>
        <button class="icon-btn side-close" data-action="side" aria-label="${t('closeMenu')}">${ICON.x}</button></div>
      <nav class="tabs" aria-label="Views">

      </nav>
      ${activeProjects.length ? `<div class="side-sec"><p>${t('projectsShort')}</p>${activeProjects.map(p => `<button class="side-link ${S.filters.project === p.id ? 'on' : ''}" data-action="project" data-id="${esc(p.id)}">${ICON.folder}<span>${esc(p.name)}</span></button>`).join('')}</div>` : ''}
      <div class="side-foot">
        <div class="who"><span class="avatar" style="background:${colorOf(me.id)}">${esc(initials(me.name))}</span><div><b>${esc(me.name)}</b><small>${esc(me.role || '')}${me.admin ? ' · ' + t('admin') : ''}</small></div></div>
        <button class="side-link" data-action="lang">🌐 <span>${t('language')}</span></button>
        <button class="side-link" data-action="notify">✉️ <span>${t('myNotify')}: ${me.notify ? t('notifyOnLabel') : t('notifyOffLabel')}</span></button>
        <button class="side-link" data-action="cal-feed">📅 <span>${t('calFeed')}</span></button>
        <button class="side-link" data-action="change-code">🔑 <span>${t('changeCode')}</span></button>
        ${me.admin ? `<a class="side-link" href="${esc(S.settings.sheetUrl)}" target="_blank" rel="noopener">📊 <span>${t('openSheet')}</span></a>` : ''}
        <button class="side-link" data-action="signout">↩ <span>${t('signOut')}</span></button>
      </div>
    </aside>
    <div class="side-scrim" data-action="side" aria-hidden="true"></div>
    <div class="content">
      <header class="topbar"><div class="topbar-in">
        <button class="icon-btn burger" data-action="side" aria-label="${t('menu')}" aria-expanded="${!!S.side}" aria-controls="side">${ICON.burger}${unread ? '<i class="dot-badge"></i>' : ''}</button>
        <span class="top-title">${esc(t(S.view === 'projects' ? 'projects' : S.view))}</span>
        <div class="top-actions">
          <button class="icon-btn bell" data-action="inbox" aria-label="${t('inbox')}${unread ? ' (' + unread + ')' : ''}">${ICON.bell}${unread ? `<b class="bell-n">${unread > 9 ? '9+' : unread}</b>` : ''}</button>
          <button class="icon-btn" data-action="sync" title="Sync" aria-label="Sync">${ICON.sync}</button>
          ${me.admin ? `<button class="btn btn-primary btn-sm" data-action="new">${ICON.plus}<span class="new-label">${t('newTask')}</span></button>` : ''}
        </div>
      </div></header>
      <main class="main" id="main"></main>

/** Notifications newer than the last time this person looked (remembered on this device). */
const unreadCount = () => { const seen = saved.get('ies-tasks-seen') || ''; return (S.inbox || []).filter(i => i.time > seen).length; };

function renderMain() {
  const el = $('#main');
  if (!el) return;
  const views = { board: viewBoard, list: viewList, mine: viewMine, calendar: viewCalendar, projects: viewProjects, dashboard: viewDashboard, team: viewTeam };
  el.innerHTML = (views[S.view] || viewBoard)();
  if (S.view === 'board') wireDrag();
}

// =============================================================================== filters
function toolbar(opts = {}) {
  const f = S.filters;
  const teams = S.settings.teams;
  const active = S.members.filter(m => m.active);
  return `<div class="toolbar">
    <input class="input search" type="search" placeholder="${t('search')}" value="${esc(f.q)}" data-filter="q" aria-label="${t('search')}">
    ${f.project && projName(f.project) ? `<button type="button" class="chip prj proj-filter" data-action="clear-project" aria-label="${t('clear')}">${ICON.folder}${esc(projName(f.project))} ✕</button>` : ''}
    ${(() => { const n = [f.team, f.who, f.prio, f.project].filter(Boolean).length; return `<button type="button" class="btn btn-sm filter-toggle" data-action="toggle-filters" aria-expanded="${S.showFilters}">${t('filters')}${n ? ` (${n})` : ''}</button>`; })()}
    <div class="filter-extra ${S.showFilters ? 'open' : ''}">
    <select class="input" data-filter="team" aria-label="${t('teamField')}"><option value="">${t('allTeams')}</option>${teams.map(x => `<option ${f.team === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
    <select class="input" data-filter="who" aria-label="${t('assignees')}"><option value="">${t('everyone')}</option>${active.map(m => `<option value="${m.id}" ${f.who === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>
    ${(S.projects || []).length ? `<select class="input" data-filter="project" aria-label="${t('project')}"><option value="">${t('allProjects')}</option>${S.projects.filter(p => !p.archived || p.id === f.project).map(p => `<option value="${esc(p.id)}" ${f.project === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>` : ''}
    <select class="input" data-filter="prio" aria-label="${t('priority')}"><option value="">${t('anyPriority')}</option>${S.priorities.map(p => `<option value="${p}" ${f.prio === p ? 'selected' : ''}>${t(p)}</option>`).join('')}</select>
    ${opts.showDone ? `<label class="check"><input type="checkbox" data-filter="showDone" ${f.showDone ? 'checked' : ''}>${t('showDone')}</label>` : ''}
    </div>
    ${f.q || f.team || f.who || f.prio || f.project ? `<button class="btn btn-ghost btn-sm" data-action="clear-filters">${t('clear')}</button>` : ''}
  </div>`;
}

function filtered(list) {
  const f = S.filters, q = f.q.trim().toLowerCase();
  return list.filter(x =>
    (!q || (x.title + ' ' + x.description + ' ' + x.labels.join(' ') + ' ' + x.id).toLowerCase().includes(q)) &&
    (!f.team || x.team === f.team) && (!f.who || x.assignees.includes(f.who)) && (!f.prio || x.priority === f.prio) && (!f.project || x.project === f.project));
}
const allTasks = () => [...S.tasks.values()];
const projName = id => { const p = (S.projects || []).find(x => x.id === id); return p ? p.name : ''; };
const tplCount = text => String(text || '').split('\n').filter(l => /^\s*[-+]?\d+\s*\|\s*\S/.test(l)).length;
/** Comment text with @mentions of team members in bold. */
function mentionHtml(text) {
  let h = esc(text);
  S.members.forEach(m => [m.name, m.name.split(' ')[0]].forEach(n => { if (!n) return; h = h.split('@' + esc(n)).join('<b class="mention">@' + esc(n) + '</b>'); }));
  return h.replace(/<b class="mention"><b class="mention">(.*?)<\/b>/g, '<b class="mention">$1');
}
const prioRank = p => S.priorities.indexOf(p);
const byDueThenPrio = (a, b) => (a.due || '9999').localeCompare(b.due || '9999') || prioRank(b.priority) - prioRank(a.priority);

// =============================================================================== views
const NEXT_STEP = { todo: ['doing', 'start'], doing: ['review', 'toReview'], review: ['done', 'markDone'] };
function card(x) {
  const done = x.checklist.filter(i => i.d).length;
  const next = NEXT_STEP[x.status];
  const due = x.due ? `<span class="due ${dueClass(x)}">${ICON.cal}${esc(fmtDay(x.due))}</span>` : '';
  return `<article class="card p-${x.priority} ${x.status === 'done' ? 'done' : ''}" draggable="true" data-action="open" data-id="${esc(x.id)}">
    <div class="card-top">${x.project && projName(x.project) ? `<span class="chip prj">${ICON.folder}${esc(projName(x.project))}</span>` : ''}${x.team ? `<span class="chip">${esc(x.team)}</span>` : ''}${x.blocked ? `<span class="chip blocked">${t('blocked')}</span>` : ''}${x.labels.slice(0, 3).map(l => `<span class="chip label">${esc(l)}</span>`).join('')}</div>
    <h3 style="margin:0"><button type="button" class="card-title" data-action="open" data-id="${esc(x.id)}">${esc(x.title || t('untitled'))}</button></h3>
    <div class="card-meta"><span class="meta-items">${due}${x.checklist.length ? `<span>${ICON.check}${done}/${x.checklist.length}</span>` : ''}${x.comments ? `<span>${ICON.chat}${x.comments}</span>` : ''}${x.attachments ? `<span title="${t('attachments')}">${ICON.clip}${x.attachments}</span>` : ''}${x.repeat ? `<span title="${t('repeat')}">${ICON.repeat}</span>` : ''}</span></div>
    ${next || x.assignees.length ? `<div class="card-foot"><span class="avatars">${x.assignees.slice(0, 4).map(avatar).join('')}</span>${next ? `<button type="button" class="adv ${next[0] === 'done' ? 'to-done' : ''}" data-action="advance" data-id="${esc(x.id)}" data-to="${next[0]}" aria-label="${esc(t(next[1]) + ': ' + x.title)}">${t(next[1])}</button>` : ''}</div>` : ''}
  </article>`;
}

/** The notices above a view: email problems, and the first-run tip until dismissed. */
const topNotes = () => mailBanner() + (saved.get('ies-tasks-tip') ? '' : `<div class="tip" role="note"><span>${t(S.me.admin ? 'tip' : 'tipMember')}</span><button class="btn btn-sm" data-action="tip-ok">${t('gotIt')}</button></div>`);

/** Says so when this member won't get emails, so nobody waits for one that can't come. */
function mailBanner() {
  if (!S.me.email) return `<div class="tip" role="status"><span>✉️ ${t('noEmailBanner')}</span></div>`;
  if (!S.me.notify) return `<div class="tip" role="status"><span>✉️ ${t('notifyOffBanner')}</span><button class="btn btn-sm" data-action="notify">${t('turnOn')}</button></div>`;
  return '';
}

function viewBoard() {
  const list = filtered(allTasks());
  const tip = topNotes();
  const tabs = `<div class="status-tabs" role="tablist">${S.statuses.map(s => `<button type="button" role="tab" data-action="board-tab" data-s="${s}" aria-selected="${S.boardTab === s}"><b>${list.filter(x => x.status === s).length}</b>${t(s)}</button>`).join('')}</div>`;
  return tip + toolbar() + tabs + `<div class="board">${S.statuses.map(s => {
    const items = list.filter(x => x.status === s).sort((a, b) => s === 'done' ? b.completedAt.localeCompare(a.completedAt) : byDueThenPrio(a, b));
    const shown = s === 'done' ? items.slice(0, 30) : items;
    return `<section class="col ${S.boardTab === s ? 'on' : ''}" data-status="${s}" aria-label="${t(s)}">
      <div class="col-head"><span class="dot" style="background:${statusColor[s]}"></span>${t(s)}<span class="count">${items.length}</span></div>
      <div class="cards">${shown.map(card).join('')}</div>
      ${s !== 'done' && S.me.admin ? `<button class="col-add" data-action="new" data-status="${s}">${t('addHere')}</button>` : ''}
    </section>`;
  }).join('')}</div>`;
}

function viewList() {
  let list = filtered(allTasks()).filter(x => S.filters.showDone || x.status !== 'done');
  const k = S.sort.key, d = S.sort.dir;
  const val = { title: x => x.title.toLowerCase(), due: x => x.due || '9999', priority: x => -prioRank(x.priority), status: x => S.statuses.indexOf(x.status), team: x => x.team };
  list.sort((a, b) => { const va = val[k](a), vb = val[k](b); return (va < vb ? -1 : va > vb ? 1 : 0) * d || byDueThenPrio(a, b); });
  const th = (key, label) => `<th><button data-action="sort" data-key="${key}">${label}${S.sort.key === key ? (S.sort.dir > 0 ? ' ▲' : ' ▼') : ''}</button></th>`;
  return toolbar({ showDone: true }) + (list.length ? `<div class="table-wrap"><table>
    <thead><tr>${th('title', t('title'))}${th('status', t('status'))}${th('priority', t('priority'))}${th('team', t('teamField'))}<th>${t('assignees')}</th>${th('due', t('due'))}</tr></thead>
    <tbody>${list.map(x => `<tr data-action="open" data-id="${esc(x.id)}" tabindex="0">
      <td><b>${esc(x.title)}</b>${x.blocked ? ` <span class="chip blocked">${t('blocked')}</span>` : ''}<div class="muted" style="font-size:12px">${esc(x.id)}</div></td>
      <td><span class="status-pill st-${x.status}">${t(x.status)}</span></td>
      <td><span class="prio"><i style="background:${prioColor(x.priority)}"></i>${t(x.priority)}</span></td>
      <td>${esc(x.team || t('none'))}</td>
      <td><span class="avatars">${x.assignees.map(avatar).join('')}</span></td>
      <td><span class="due ${dueClass(x)}">${esc(fmtDay(x.due) || t('none'))}</span></td>
    </tr>`).join('')}</tbody></table></div>` : `<div class="empty">${t('noTasks')}</div>`);
}

function viewMine() {
  const today = todayStr(), week = addDays(today, 7);
  const mine = allTasks().filter(x => x.assignees.includes(S.me.id));
  const open = mine.filter(x => x.status !== 'done');
  const groups = [
    ['overdue', open.filter(x => x.due && x.due < today)],
    ['today', open.filter(x => x.due === today)],
    ['thisWeek', open.filter(x => x.due > today && x.due <= week)],
    ['later', open.filter(x => x.due > week)],
    ['noDate', open.filter(x => !x.due)],
    ['doneRecently', mine.filter(doneInLast7)],
  ].filter(g => g[1].length);
  if (!groups.length) return `<h1 class="page-title">${t('mine')}</h1>${topNotes()}<div class="empty">${t('noTasks')}</div>`;
  return `<h1 class="page-title">${t('mine')}</h1>${topNotes()}` + groups.map(([k, items]) => `<section class="group"><h2>${t(k)} <span class="count">${items.length}</span></h2>
    <div class="grid-cards">${items.sort(byDueThenPrio).map(card).join('')}</div></section>`).join('');
}

function viewCalendar() {
  const today = todayStr();
  if (!S.cal) S.cal = { y: Number(today.slice(0, 4)), m: Number(today.slice(5, 7)) - 1 };
  const { y, m } = S.cal;
  const first = new Date(Date.UTC(y, m, 1));
  const start = new Date(first); start.setUTCDate(1 - first.getUTCDay());
  const list = filtered(allTasks());
  // The selected day (phones list its tasks under the month): the chosen one if in this month, else today or the 1st.
  const inMonth = ds => ds && Number(ds.slice(0, 4)) === y && Number(ds.slice(5, 7)) - 1 === m;
  const sel = inMonth(S.calDay) ? S.calDay : inMonth(today) ? today : `${y}-${String(m + 1).padStart(2, '0')}-01`;
  const dayItems = list.filter(x => x.due === sel).sort(byDueThenPrio);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setUTCDate(start.getUTCDate() + i);
    const ds = d.toISOString().slice(0, 10);
    const items = list.filter(x => x.due === ds).sort((a, b) => prioRank(b.priority) - prioRank(a.priority));
    cells.push(`<div class="day ${d.getUTCMonth() !== m ? 'other' : ''} ${ds === today ? 'today' : ''} ${ds === sel ? 'sel' : ''}" data-action="cal-day" data-d="${ds}"><span class="n">${d.getUTCDate()}</span>
      ${items.length ? `<span class="dots" aria-hidden="true">${items.slice(0, 3).map(x => `<i style="background:${prioColor(x.priority)}"></i>`).join('')}${items.length > 3 ? '<b>+</b>' : ''}</span>` : ''}
      ${items.slice(0, 4).map(x => `<button data-action="open" data-id="${esc(x.id)}" class="${x.status === 'done' ? 'is-done' : ''}" style="border-inline-start-color:${prioColor(x.priority)}" title="${esc(x.title)}">${esc(x.title)}</button>`).join('')}
      ${items.length > 4 ? `<span class="muted" style="font-size:11px">+${items.length - 4}</span>` : ''}</div>`);
    if (i >= 34 && d.getUTCMonth() !== m && d.getUTCDay() === 6) break;
  }
  const flip = S.lang === 'ar' ? ['M9 6l6 6-6 6', 'M15 6l-6 6 6 6'] : ['M15 6l-6 6 6 6', 'M9 6l6 6-6 6'];
  return toolbar() + `<div class="cal-head">
      <button class="icon-btn" data-action="cal" data-step="-1" aria-label="${t('prev')}">${ICON.chev(flip[0])}</button>
      <h2>${t('months')[m]} ${y}</h2>
      <button class="icon-btn" data-action="cal" data-step="1" aria-label="${t('next')}">${ICON.chev(flip[1])}</button>

// =============================================================================== drag & drop (desktop)
function wireDrag() {
  document.querySelectorAll('.card[draggable]').forEach(c => {
    c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', c.dataset.id); c.classList.add('dragging'); });
    c.addEventListener('dragend', () => c.classList.remove('dragging'));
  });
  document.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drop'); });
    col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('drop'); });
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('drop');
      const id = e.dataTransfer.getData('text/plain'), status = col.dataset.status, x = S.tasks.get(id);
      if (!x || x.status === status) return;
      advanceTask(id, status);
    });
  });
}

// =============================================================================== task drawer
let D = null; // the open drawer: { id, orig, draft }

/** Moves a task to another status right away (card button or drag), and puts it back if the server says no. */
function advanceTask(id, status, quiet) {
  const x = S.tasks.get(id);
  if (!x || x.status === status) return;
  const prev = x.status;
  S.tasks.set(id, Object.assign({}, x, { status }));
  const view = () => { if (D && D.view && D.id === id) renderDrawerKeepScroll(); };
  renderMain(); view();
  if (!quiet) toast(t('movedTo').replace('{s}', t(status)), false, () => advanceTask(id, prev, true));
  api('api_saveTask', { id, status, base: { status: prev } }).then(saved => {
    S.tasks.set(id, saved);
    if (saved.spawned) { S.tasks.set(saved.spawned.id, saved.spawned); toast(t('repeatedNext').replace('{d}', fmtDay(saved.spawned.due))); }
    renderMain(); view();
  })
    .catch(err => { S.tasks.set(id, Object.assign({}, x, { status: prev })); renderMain(); view(); fail(err); if (err.code === 'CONFLICT') sync(); });
}

const BIG_NEXT = { todo: 'startBig', doing: 'toReviewBig', review: 'doneBig' };
const autolink = html => html.replace(/(https?:[^\s<]+[^\s<.,;:!?)\]'"])/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
function dueWords(due) {
  const n = Math.round((Date.parse(due + 'T12:00:00Z') - Date.parse(todayStr() + 'T12:00:00Z')) / 864e5);
  const days = k => S.lang === 'ar' ? (k === 1 ? 'يوم' : k === 2 ? 'يومين' : k <= 10 ? `${k} أيام` : `${k} يوم`) : `${k} day${k === 1 ? '' : 's'}`;
  return n < 0 ? t('overdueBy').replace('{n}', days(-n)) : n === 0 ? t('todayW') : n === 1 ? t('tomorrowW') : t('inDays').replace('{n}', days(n));
}

/** A member ticks a step: saved straight away, merged with anyone else's ticks. */
function tickStep(n, checked) {
  const x = S.tasks.get(D.id);
  if (!x) return;
  const before = x.checklist, after = before.map((i, k) => (k === n ? { t: i.t, d: checked } : i));
  S.tasks.set(x.id, Object.assign({}, x, { checklist: after }));
  renderDrawerKeepScroll(); renderMain();
  api('api_saveTask', { id: x.id, checklist: after, base: { checklist: before } })
    .then(saved => { S.tasks.set(saved.id, saved); if (D && D.view && D.id === saved.id) renderDrawerKeepScroll(); renderMain(); })
    .catch(err => { S.tasks.set(x.id, x); if (D && D.view) renderDrawerKeepScroll(); renderMain(); fail(err); });
}

function openTask(id, preset) {
  const x = id ? S.tasks.get(id) : null;
  if (!S.me.admin) {
    // Members read tasks and work on them; admins write them (the server enforces the same rule).
    if (!x) return;
    D = { id: x.id, view: true, detail: null, pending: [], uploading: [] };
    renderTaskView();
    api('api_taskDetail', x.id).then(det => { if (D && D.id === x.id) { D.detail = det; renderDetail(); } }).catch(() => {});
    return;
  }
  const myTeam = S.settings.teams.includes(S.me.team) ? S.me.team : '';
  const base = x || { title: '', description: '', status: 'todo', priority: 'medium', team: myTeam, assignees: [], due: '', labels: [], checklist: [], blocked: false, project: S.filters.project || '', repeat: '', ...preset };
  D = { id: x ? x.id : null, orig: JSON.parse(JSON.stringify(base)), draft: JSON.parse(JSON.stringify(base)), detail: null,
    moreOpen: !!(x && (x.labels.length || x.blocked || x.repeat)), pending: [], uploading: [] };
  renderDrawer();
  if (x) api('api_taskDetail', x.id).then(det => { if (D && D.id === x.id) { D.detail = det; renderDetail(); } }).catch(() => {});
  setTimeout(() => { const el = $('#d-title'); if (el && !x) el.focus(); }, 30);
}

function dirtyFields() {
  if (!D || D.view) return {};
  const out = {};
  ['title', 'description', 'status', 'priority', 'team', 'due', 'blocked', 'project', 'repeat'].forEach(k => { if ((D.draft[k] || '') !== (D.orig[k] || '')) out[k] = D.draft[k]; });
  ['assignees', 'labels', 'checklist'].forEach(k => { if (JSON.stringify(D.draft[k]) !== JSON.stringify(D.orig[k])) out[k] = D.draft[k]; });
  return out;
}

function wireDrawer() {
  const form = $('#task-form');
  form.addEventListener('input', e => {
    const el = e.target;
    if (el.name === 'title' || el.name === 'description' || el.name === 'due') D.draft[el.name] = el.value;
    if (el.name === 'due') document.querySelectorAll('[data-action="d-due"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === el.value)));
    if (el.name === 'labels') D.draft.labels = el.value.split(',').map(s => s.trim()).filter(Boolean);
    if (el.dataset.cl !== undefined) D.draft.checklist[Number(el.dataset.cl)].t = el.value;
  });
  form.addEventListener('change', e => {
    const el = e.target;
    if (el.name === 'priority' || el.name === 'team' || el.name === 'project' || el.name === 'repeat') D.draft[el.name] = el.value;
    if (el.name === 'blocked') D.draft.blocked = el.checked;
  });
  form.addEventListener('submit', e => e.preventDefault());
  wireFiles();
  const more = form.querySelector('details.more');
  if (more) more.addEventListener('toggle', () => { if (D) D.moreOpen = more.open; });
  $('#cl-new').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (addTypedStep()) renderDrawerKeepScroll(() => $('#cl-new') && $('#cl-new').focus());

}

// History lines are stored in English in the sheet (an audit trail); show them in the reader's language.
const actText = a => t('acts')[a] || a;
const changeText = d => String(d).split(' · ').map(part => {
  const m = /^(\w+)(:?)\s*(.*)$/.exec(part);
  if (!m || !(m[1] in t('acts'))) return part;
  const vals = m[3].replace(/\b(todo|doing|review|done|low|medium|high|urgent)\b/g, v => t(v));
  return t('acts')[m[1]] + (m[2] || m[3] ? (m[2] ? ': ' : ' ') + vals : '');
}).join(' · ');

// =============================================================================== attachments
const MAX_FILE = 10 * 1024 * 1024;
const fmtSize = n => n < 1024 ? n + ' B' : n < 1048576 ? Math.round(n / 1024) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
const fileKind = (name, type) => {
  const ext = (String(name).split('.').pop() || '').toLowerCase();
  if (String(type).indexOf('image' + '/') === 0) return ['img', ext.toUpperCase().slice(0, 4) || 'IMG'];
  if (ext === 'pdf') return ['pdf', 'PDF'];
  if (/^docx?$/.test(ext)) return ['doc', 'DOC'];
  if (/^(xlsx?|csv)$/.test(ext)) return ['xls', ext.toUpperCase()];
  if (/^pptx?$/.test(ext)) return ['ppt', 'PPT'];
  return ['', (ext || 'FILE').toUpperCase().slice(0, 4)];
};

function renderAttach() {
  const el = $('#attach');
  if (!el || !D) return;
  const list = (D.detail && D.detail.attachments) || [];
  const canRemove = a => S.me.admin || a.byId === S.me.id;
  const images = list.filter(a => a.thumb), files = list.filter(a => !a.thumb);
  const xBtn = a => canRemove(a) ? `<button type="button" class="x-btn" data-action="attach-remove" data-id="${esc(a.id)}" aria-label="${t('removeFile')}: ${esc(a.name)}">${ICON.x}</button>` : '';
  const kind = (n, ty) => { const k = fileKind(n, ty); return `<span class="file-ico ${k[0]}">${esc(k[1])}</span>`; };
  el.innerHTML =
    (images.length ? `<div class="attach-grid">${images.map(a => `<div class="thumb"><a href="${esc(a.url)}" target="_blank" rel="noopener" title="${esc(a.name)}"><img src="${esc(a.thumb)}" alt="${esc(a.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest('.thumb').classList.add('noimg')"><span>${esc(a.name)}</span></a>${xBtn(a)}</div>`).join('')}</div>` : '') +
    (files.length || D.uploading.length || D.pending.length ? `<div class="file-list">` +
      files.map(a => `<div class="file-row">${kind(a.name, a.type)}<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name)}</a><small>${fmtSize(a.size)} · ${t('uploadedBy')} ${esc(a.by)}</small>${xBtn(a)}</div>`).join('') +
      D.uploading.map(u => `<div class="file-row busy" aria-live="polite">${kind(u.name, u.type)}<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(u.name)}</span><small>${t('uploading')}</small></div>`).join('') +
      D.pending.map((f, n) => `<div class="file-row">${kind(f.name, f.type)}<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</span><small>${fmtSize(f.size)} · ${t('pendingNote')}</small><button type="button" class="x-btn" data-action="pending-remove" data-n="${n}" aria-label="${t('removeFile')}: ${esc(f.name)}">${ICON.x}</button></div>`).join('') +
    `</div>` : '');
}

const readBase64 = file => new Promise((ok, ko) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).replace(/^data:[^,]*,/, ''));
  r.onerror = () => ko(Object.assign(new Error('read'), { code: 'file' }));
  r.readAsDataURL(file);
});

/** Big photos from phones (often 5–12 MB) are resized to 2000 px JPEG before upload: faster, and enough for any screen. */
async function shrinkImage(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 1.5 * 1048576 || !window.createImageBitmap) return file;
  try {
    const img = await createImageBitmap(file);
    const k = Math.min(1, 2000 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.(png|webp|jpe?g)$/i, '') + '.jpg', { type: 'image/jpeg' });
  } catch (e) { return file; }
}

async function addFiles(fileList) {
  if (!D) return;
  for (const original of [...fileList]) {
    const file = await shrinkImage(original);
    if (file.size > MAX_FILE) { toast(errText('file-size'), true); continue; }
    if (!D) return;
    if (!D.id) { D.pending.push(file); renderAttach(); }
    else uploadFile(D.id, file);
  }
}

/** Uploads one file to a saved task. Works even if the task is closed meanwhile. */
function uploadFile(taskId, file) {
  const u = { name: file.name, type: file.type };
  if (D && D.id === taskId) { D.uploading.push(u); renderAttach(); }
  const done = () => { if (D) { const i = D.uploading.indexOf(u); if (i >= 0) D.uploading.splice(i, 1); } };
  return readBase64(file)
    .then(data => api('api_uploadAttachment', taskId, { name: file.name, type: file.type || 'application/octet-stream', data }))
    .then(a => {
      done();
      const x = S.tasks.get(taskId);
      if (x) S.tasks.set(taskId, Object.assign({}, x, { attachments: (x.attachments || 0) + 1 }));
      if (D && D.id === taskId) { D.detail = Object.assign({ comments: [], activity: [] }, D.detail); D.detail.attachments = (D.detail.attachments || []).concat([a]); renderAttach(); }
      renderMain();
      toast(t('uploaded'));
    })
    .catch(err => { done(); if (D && D.id === taskId) renderAttach(); fail(err); });
}

/** A step typed in the "add a step" box counts even if Enter or Add wasn't pressed. */
function addTypedStep() {
  const box = $('#cl-new'), v = box ? box.value.trim() : '';
  if (!v || !D) return false;
  D.draft.checklist.push({ t: v, d: false });
  box.value = '';
  return true;
}

/** The file picker, drag and drop onto the task, for both the edit form and the read view. */
function wireFiles() {
  const fileIn = $('#file-in');
  if (fileIn) fileIn.addEventListener('change', () => { addFiles(fileIn.files); fileIn.value = ''; });
  const drawer = document.querySelector('.drawer');
  const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  drawer.addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); drawer.classList.add('dragover'); });
  drawer.addEventListener('dragleave', e => { if (e.target === drawer || !drawer.contains(e.relatedTarget)) drawer.classList.remove('dragover'); });
  drawer.addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); drawer.classList.remove('dragover'); addFiles(e.dataTransfer.files); });
}

function renderDrawerKeepScroll(after) {
  const body = document.querySelector('.drawer-body'), top = body ? body.scrollTop : 0;
  const box = $('#c-new'), typed = box ? box.value : '';
  if (D && D.view) renderTaskView(); else renderDrawer();
  if (typed && $('#c-new')) $('#c-new').value = typed;
  const b2 = document.querySelector('.drawer-body');
  if (b2) b2.scrollTop = top;
  if (after) after();
}

function closeDrawer(force) {
  if (!D) return;
  if (!force && (Object.keys(dirtyFields()).length || D.pending.length)) return confirmBox(t('unsaved'), () => closeDrawer(true));
  D = null;
  $('#layer').innerHTML = '';
}

function saveTask() {
  addTypedStep();
  const patch = dirtyFields();
  if (!D.id && !D.draft.title.trim()) { const f = $('#d-title'); if (f) { f.scrollIntoView({ block: 'center' }); f.focus(); } return toast(errText('title'), true); }
  if (D.id && !Object.keys(patch).length) return closeDrawer(true);
  if (!D.id) Object.assign(patch, { title: D.draft.title, status: D.draft.status, priority: D.draft.priority, team: D.draft.team, project: D.draft.project || '', repeat: D.draft.repeat || '' }); // prefilled fields count too
  if (D.id) {
    patch.id = D.id;
    // What this editor started from, so the server can merge with (or refuse to overwrite) someone else's changes.
    patch.base = {};
    Object.keys(patch).forEach(k => { if (k !== 'id' && k !== 'base') patch.base[k] = D.orig[k]; });
  }
  const btn = $('#save-btn');
  btn.disabled = true; btn.textContent = t('saving');
  const queued = D.id ? [] : D.pending.slice();
  api('api_saveTask', patch).then(x => {
    S.tasks.set(x.id, x);
    toast(D.id ? t('saved') : t('created'));
    if (x.spawned) { S.tasks.set(x.spawned.id, x.spawned); toast(t('repeatedNext').replace('{d}', fmtDay(x.spawned.due))); }
    closeDrawer(true);
    renderMain();
    queued.reduce((p, f) => p.then(() => uploadFile(x.id, f)), Promise.resolve());
  }).catch(err => {
    btn.disabled = false; btn.textContent = t('save');
    if (err.code !== 'CONFLICT') return fail(err);
    // Someone else changed the same field meanwhile: load their version as the new starting point, keep what this
    // person typed, and say so. Saving again keeps this person's version, knowingly.
    const id = D.id;
    Promise.resolve(sync()).then(() => {
      const fresh = S.tasks.get(id);
      if (!D || D.id !== id || !fresh) return;
      err.fields.forEach(k => { if (k in fresh) D.orig[k] = JSON.parse(JSON.stringify(fresh[k])); });
      renderDrawer();
      fail(err);
    });
  });
}

// =============================================================================== modals
function modal(html, onReady) {
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="scrim modal-scrim" data-action="close-modal"></div><div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  wrap.className = 'modal-wrap';
  document.body.appendChild(wrap);
  const first = wrap.querySelector('input,select,textarea,button:not([data-action="close-modal"])');
  if (first) setTimeout(() => first.focus(), 20);
  if (onReady) onReady(wrap);
  return wrap;
}
const closeModal = () => document.querySelectorAll('.modal-wrap').forEach(m => m.remove());

function confirmBox(text, yes) {
  modal(`<p style="margin:0;font-size:16px">${esc(text)}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-action="close-modal">${t('cancel')}</button><button class="btn btn-dark" id="confirm-yes">${t('yes')}</button></div>`,
    w => w.querySelector('#confirm-yes').addEventListener('click', () => { closeModal(); yes(); }));
}

function showCode(name, code) {
  modal(`<h2>${t('codeFor')} ${esc(name)}</h2><div class="code-box" id="code-box">${esc(code)}</div><p class="muted" style="margin:0">${t('codeOnce')}</p>

  w => w.querySelector('#copy-code').addEventListener('click', () => {
    const done = () => toast(t('copied'));
    if (navigator.clipboard) navigator.clipboard.writeText(code).then(done, () => selectCode());
    else selectCode();
    function selectCode() { const r = document.createRange(); r.selectNodeContents(w.querySelector('#code-box')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); try { document.execCommand('copy'); done(); } catch (e) {} }
  }));
}
