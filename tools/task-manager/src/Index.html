    <label class="field"><span>${t('confirmCode')}</span><input class="input" name="again" dir="ltr" autocomplete="new-password" required></label>
    <p class="error" id="code-error" role="alert"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" data-action="close-modal">${t('cancel')}</button><button class="btn btn-dark" type="submit">${t('save')}</button></div>
  </form>`, w => w.querySelector('#code-form').addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target;
    if (f.next.value !== f.again.value) return (f.querySelector('#code-error').textContent = t('mismatch'));
    api('api_changeCode', f.cur.value, f.next.value).then(r => {
      S.token = r.token; saved.set('ies-tasks-token', r.token); closeModal(); toast(t('codeChanged'));
    }).catch(err => { f.querySelector('#code-error').textContent = errText(err.code); });
  }));
}

// =============================================================================== events
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (S.menu && !e.target.closest('.menu') && !(el && el.dataset.action === 'menu')) { S.menu = false; render(); if (!el) return; }
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'view') { S.view = el.dataset.view; saved.set('ies-tasks-view', S.view); S.menu = false; S.side = false; render(); window.scrollTo(0, 0); }
  else if (a === 'side') { S.side = !S.side; render(); if (S.side) { const f = document.querySelector('.side .tab[aria-current]'); if (f) f.focus(); } }
  else if (a === 'project') { S.filters.project = el.dataset.id; S.view = 'board'; saved.set('ies-tasks-view', 'board'); S.side = false; render(); window.scrollTo(0, 0); }
  else if (a === 'clear-project') { S.filters.project = ''; render(); }
  else if (a === 'project-new') projectForm(null);
  else if (a === 'project-edit') projectForm(el.dataset.id);
  else if (a === 'toggle-archived-p') { S.showArchivedP = el.checked; renderMain(); }
  else if (a === 'inbox') inboxModal();
  else if (a === 'inbox-open') { closeModal(); const id = el.dataset.id; if (S.tasks.has(id)) openTask(id); }
  else if (a === 'cal-feed') { S.side = false; render(); calFeedModal(); }
  else if (a === 'mention') insertMention(el.dataset.name);
  else if (a === 'new') openTask(null, el.dataset.status ? { status: el.dataset.status } : {});
  else if (a === 'open') openTask(el.dataset.id);
  else if (a === 'sync') sync(true);
  else if (a === 'menu') { S.side = !S.side; render(); }
  else if (a === 'lang') { S.lang = S.lang === 'ar' ? 'en' : 'ar'; saved.set('ies-tasks-lang', S.lang); S.menu = false; if (S.me) render(); else showLogin(); }
  else if (a === 'signout') signOut(false);
  else if (a === 'change-code') { S.menu = false; S.side = false; render(); changeCodeForm(); }
  else if (a === 'notify') api('api_setNotify', !S.me.notify).then(r => { S.me.notify = r.notify; S.menu = false; render(); toast(r.notify ? t('notifyNowOn').replace('{e}', S.me.email || '—') : t('notifyNowOff')); }).catch(fail);
  else if (a === 'clear-filters') { S.filters = { q: '', team: '', who: '', prio: '', project: '', showDone: S.filters.showDone }; renderMain(); }
  else if (a === 'sort') { const k = el.dataset.key; S.sort = { key: k, dir: S.sort.key === k ? -S.sort.dir : 1 }; renderMain(); }
  else if (a === 'cal') { const st = Number(el.dataset.step); if (!st) S.cal = null; else { let m = S.cal.m + st, y = S.cal.y; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } S.cal = { y, m }; } renderMain(); }
  else if (a === 'close-drawer') closeDrawer(false);
  else if (a === 'save-task') saveTask();
  else if (a === 'advance') advanceTask(el.dataset.id, el.dataset.to);
  else if (a === 'undo') { const u = S.undo; S.undo = null; $('#toast').classList.add('hidden'); if (u) u(); }
  else if (a === 'cal-day') { S.calDay = el.dataset.d; renderMain(); }
  else if (a === 'v-status') advanceTask(D.id, el.dataset.v);
  else if (a === 'v-tick') tickStep(Number(el.dataset.n), el.checked);
  else if (a === 'attach-pick') { const i = $('#file-in'); if (i) i.click(); }
  else if (a === 'pending-remove') { D.pending.splice(Number(el.dataset.n), 1); renderAttach(); }
  else if (a === 'attach-remove') {
    const id = el.dataset.id, taskId = D.id;
    confirmBox(t('confirmRemoveFile'), () => api('api_removeAttachment', id).then(() => {
      const x = S.tasks.get(taskId);
      if (x) S.tasks.set(taskId, Object.assign({}, x, { attachments: Math.max(0, (x.attachments || 1) - 1) }));
      if (D && D.id === taskId && D.detail) { D.detail.attachments = D.detail.attachments.filter(f => f.id !== id); renderAttach(); }
      renderMain();
    }).catch(fail));
  }
  else if (a === 'board-tab') { S.boardTab = el.dataset.s; saved.set('ies-tasks-tab', S.boardTab); renderMain(); }
  else if (a === 'toggle-filters') { S.showFilters = !S.showFilters; renderMain(); }
  else if (a === 'tip-ok') { saved.set('ies-tasks-tip', '1'); renderMain(); }
  else if (a === 'cl-add') { if (addTypedStep()) renderDrawerKeepScroll(() => $('#cl-new') && $('#cl-new').focus()); }
  else if (a === 'd-prio') { D.draft.priority = el.dataset.v; document.querySelectorAll('[data-action="d-prio"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === D.draft.priority))); }
  else if (a === 'd-due') { D.draft.due = el.dataset.v; const i = document.querySelector('[name="due"]'); if (i) i.value = D.draft.due; document.querySelectorAll('[data-action="d-due"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === D.draft.due))); }
  else if (a === 'd-status') { D.draft.status = el.dataset.v; document.querySelectorAll('[data-action="d-status"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === D.draft.status))); }
  else if (a === 'd-person') { const id = el.dataset.id, list = D.draft.assignees; const i = list.indexOf(id); if (i >= 0) list.splice(i, 1); else list.push(id); el.setAttribute('aria-pressed', String(i < 0)); }
  else if (a === 'cl-toggle') { D.draft.checklist[Number(el.dataset.n)].d = el.checked; renderDrawerKeepScroll(); }
  else if (a === 'cl-remove') { D.draft.checklist.splice(Number(el.dataset.n), 1); renderDrawerKeepScroll(); }
  else if (a === 'post-comment') {
    const box = $('#c-new'), text = box.value.trim();
    if (!text) return;
    el.disabled = true;
    box.value = '';
    api('api_addComment', D.id, text).then(c => {
      const x = S.tasks.get(c.taskId); if (x) S.tasks.set(x.id, Object.assign({}, x, { comments: x.comments + 1 }));
      renderMain();
      if ($('#c-new')) $('#c-new').value = '';
      if (D && D.id === c.taskId) {
        // Reload comments and history together, so a comment posted before they first loaded is never lost.
        D.detail = Object.assign({}, D.detail || { activity: [] }, { comments: ((D.detail && D.detail.comments) || []).concat([c]) });
        renderDetail();
        return api('api_taskDetail', c.taskId).then(det => { if (D && D.id === c.taskId) { D.detail = det; renderDetail(); } });
      }
    }).catch(err => { el.disabled = false; fail(err); });
  }
  else if (a === 'archive') confirmBox(t('confirmArchive'), () => api('api_archiveTask', D.id, true).then(x => { S.tasks.delete(x.id); closeDrawer(true); renderMain(); toast(t('archived')); }).catch(fail));
  else if (a === 'delete') confirmBox(t('confirmDelete'), () => api('api_deleteTask', D.id).then(r => { S.tasks.delete(r.id); closeDrawer(true); renderMain(); toast(t('deleted')); }).catch(fail));
  else if (a === 'close-modal') closeModal();
  else if (a === 'member') memberForm(el.dataset.id);
  else if (a === 'reset-code') { const m = S.members.find(x => x.id === el.dataset.id); confirmBox(t('resetConfirm'), () => api('api_resetCode', m.id, false).then(r => showCode(m.name, r.code)).catch(fail)); }
});

/** "@na" before the caret in a comment: suggest team members; picking one writes "@Name ". */
function mentionQuery(el) { const m = /@([^\s@]{0,20})$/.exec(el.value.slice(0, el.selectionStart)); return m ? m[1] : null; }
function showMentions(el) {
  const box = $('#mention-box'); if (!box) return;
  const q = mentionQuery(el);
  const list = q === null ? [] : S.members.filter(m => m.active && m.id !== S.me.id && (m.name.toLowerCase().startsWith(q.toLowerCase()) || m.name.toLowerCase().includes(' ' + q.toLowerCase()))).slice(0, 6);
  box.hidden = !list.length;
  box.innerHTML = list.map(m => { const first = m.name.split(' ')[0], dup = S.members.filter(x => x.name.split(' ')[0] === first).length > 1;
    return `<button type="button" role="option" data-action="mention" data-name="${esc(dup ? m.name : first)}">${avatar(m.id)}${esc(m.name)}</button>`; }).join('');
}
function insertMention(name) {
  const el = $('#c-new'); if (!el) return;
  const pos = el.selectionStart, before = el.value.slice(0, pos).replace(/@([^\s@]{0,20})$/, '@' + name + ' ');
  el.value = before + el.value.slice(pos);
  el.focus(); el.setSelectionRange(before.length, before.length);
  $('#mention-box').hidden = true;
}

document.addEventListener('input', e => {
  if (e.target.id === 'c-new') return showMentions(e.target);
  const k = e.target.dataset && e.target.dataset.filter;
  if (!k) return;
  S.filters[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if (k === 'q') { clearTimeout(S.qt); S.qt = setTimeout(() => { renderMain(); const s = $('.search'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 200); }
  else renderMain();
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'settings-form') return;
  e.preventDefault();
  const f = e.target;
  api('api_saveSettings', { teams: f.teams.value.split('\n').map(s => s.trim()).filter(Boolean), digest: f.digest.checked, digestHour: Number(f.digestHour.value), eventTemplate: f.eventTemplate.value })
    .then(s => { S.settings = Object.assign(S.settings, s); renderMain(); toast(t('settingsSaved')); }).catch(fail);
});

document.addEventListener('paste', e => {
  if (!D || !e.clipboardData || !e.clipboardData.files.length) return;
  e.preventDefault();
  addFiles(e.clipboardData.files);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (document.querySelector('.modal-wrap')) closeModal(); else if (D) closeDrawer(false); else if (S.side) { S.side = false; render(); } else if (S.menu) { S.menu = false; render(); } }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && D) saveTask();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-action="open"]:not(button)')) { e.preventDefault(); openTask(e.target.dataset.id); }
});

boot();
})();
</script>
</body>
</html>
